name: macOS Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64

permissions:
  contents: write

jobs:
  build-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos-arm64' }}
    runs-on: macos-15

    env:
      PYTHON_URL: "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-aarch64-apple-darwin-install_only.tar.gz"
      TARGET_NAME: "macos-arm64"
      PIP_PACKAGES: "tensorflow tensorflow-metal fastapi uvicorn pandas scikit-learn yfinance numpy peewee joblib"

    steps: &build_steps
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: brew install imagemagick

      - name: Patch macOS Configs
        run: |
          for ENTITLEMENTS in macos/Runner/*.entitlements; do
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$ENTITLEMENTS"
          done

          /usr/libexec/PlistBuddy \
            -c "Set :LSMinimumSystemVersion 12.0" \
            macos/Runner/Info.plist

      - name: Prepare Custom Icon
        run: |
          iconutil -c icns StockD.iconset -o StockD.icns || true

          find macos/Runner/Assets.xcassets/AppIcon.appiconset \
            -name "*.icns" \
            -exec cp StockD.icns {} \; || true

      - name: Build macOS App
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p backend_bundle/artifacts

          curl -L "$PYTHON_URL" -o python_mac.tar.gz

          tar -xzf python_mac.tar.gz \
            -C backend_bundle/ \
            --strip-components=1

          ./backend_bundle/bin/python3 -m pip install --upgrade pip

          ./backend_bundle/bin/pip install $PIP_PACKAGES

          cp ML/*.py backend_bundle/

          cp \
            ML/artifacts/*.json \
            ML/artifacts/*.weights.h5 \
            ML/artifacts/*.joblib \
            backend_bundle/artifacts/

          flutter config --enable-macos-desktop
          flutter pub get

          flutter build macos \
            --release \
            --build-name="1.2.0" \
            --build-number=1 \
            --target-platform-version=12.0

          APP_DIR="build/macos/Build/Products/Release/StockD.app"

          BUNDLE_DIR="$APP_DIR/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"

          mkdir -p "$BUNDLE_DIR"

          cp -R backend_bundle/* "$BUNDLE_DIR/"

          cat << 'EOF' > "$BUNDLE_DIR/sage_launcher.sh"
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export PYTHONHOME="$SCRIPT_DIR"
          export PYTHONPATH="$SCRIPT_DIR:$SCRIPT_DIR/lib/python3.12/site-packages"
          export PYTHONUNBUFFERED=1
          exec "$SCRIPT_DIR/bin/python3" "$SCRIPT_DIR/main.py" "$@"
          EOF

          chmod -R +x "$BUNDLE_DIR"
          chmod +x "$BUNDLE_DIR/sage_launcher.sh"

          # Reinforce icon inside final bundle
          cp StockD.icns "$APP_DIR/Contents/Resources/AppIcon.icns" || true
          cp StockD.icns "$APP_DIR/Contents/Resources/" || true

          touch "$APP_DIR"
          touch "$APP_DIR/Contents/Info.plist"

          APP_DIR_ESCAPED="$APP_DIR"
          xcrun SetFile -a C "$APP_DIR_ESCAPED" || true

          STAGING="dmg_staging_$TARGET_NAME"
          RW_DMG="StockD-$TARGET_NAME-rw.dmg"
          FINAL_DMG="StockD-$TARGET_NAME.dmg"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          cp -R "$APP_DIR" "$STAGING/StockD.app"

          ln -s /Applications "$STAGING/Applications"

          cp StockD.icns "$STAGING/.VolumeIcon.icns"

          hdiutil create \
            "$RW_DMG" \
            -volname "StockD" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDRW

          DEVICE=$(hdiutil attach "$RW_DMG" -nobrowse -noverify | awk '/Apple_HFS/ {print $1}')

          sleep 3

          xcrun SetFile -a C "/Volumes/StockD" || true

          sync
          sleep 2

          hdiutil detach "$DEVICE"

          hdiutil convert \
            "$RW_DMG" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -o "$FINAL_DMG"

          rm -f "$RW_DMG"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: StockD-${{ env.TARGET_NAME }}.dmg

  build-x64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos-x64' }}
    runs-on: macos-15-intel

    env:
      PYTHON_URL: "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-x86_64-apple-darwin-install_only.tar.gz"
      TARGET_NAME: "macos-x64"
      PIP_PACKAGES: "tensorflow fastapi uvicorn pandas scikit-learn yfinance numpy peewee joblib"

    steps: *build_steps
