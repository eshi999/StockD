name: macOS Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - macos-intel

permissions:
  contents: write

jobs:
  # =========================================================
  # ARM64 (Apple Silicon M1/M2/M3/M4)
  # =========================================================
  macos-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos-arm64' }}
    runs-on: macos-15
    env: { TARGET: "macos-arm64", ARCH: "arm64" }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build and Package
        run: |
          export MACOSX_DEPLOYMENT_TARGET="11.0"
          export CFLAGS="-mmacosx-version-min=11.0"
          export CXXFLAGS="-mmacosx-version-min=11.0"
          export LDFLAGS="-mmacosx-version-min=11.0"

          # ── Python standalone ──────────────────────────────
          PYTHON_URL="https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-aarch64-apple-darwin-install_only.tar.gz"
          curl -L "$PYTHON_URL" -o python.tar.gz
          mkdir -p backend_bundle/artifacts
          tar -xzf python.tar.gz -C backend_bundle/ --strip-components=1
          ./backend_bundle/bin/python3 -m ensurepip
          ./backend_bundle/bin/pip install --upgrade pip
          ./backend_bundle/bin/pip install tensorflow tensorflow-metal fastapi uvicorn pandas scikit-learn yfinance numpy peewee joblib

          # ── ML source and artifacts ────────────────────────
          cp ML/*.py backend_bundle/ 2>/dev/null || true
          cp ML/artifacts/*.json backend_bundle/artifacts/ 2>/dev/null || true
          cp ML/artifacts/*.weights.h5 backend_bundle/artifacts/ 2>/dev/null || true
          cp ML/artifacts/*.joblib backend_bundle/artifacts/ 2>/dev/null || true
          cp ML/artifacts/*.pkl backend_bundle/artifacts/ 2>/dev/null || true
          cp ML/artifacts/*.keras backend_bundle/artifacts/ 2>/dev/null || true

          # ── Flutter build ──────────────────────────────────
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --build-name=1.2.0 --build-number=1 \
            --dart-define=MACOSX_DEPLOYMENT_TARGET=11.0

          # ── Inject backend into app bundle ─────────────────
          APP="build/macos/Build/Products/Release/StockD.app"
          BUNDLE_DIR="$APP/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
          mkdir -p "$BUNDLE_DIR"
          cp -R backend_bundle/* "$BUNDLE_DIR/"

          # ── Launcher (sage_backend) ────────────────────────
          cat > "$BUNDLE_DIR/sage_backend" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export ML_DIR="$SCRIPT_DIR"
          export PYTHONPATH="$SCRIPT_DIR:$PYTHONPATH"
          exec "$SCRIPT_DIR/bin/python3" "$SCRIPT_DIR/main.py" "$@"
          EOF
          chmod +x "$BUNDLE_DIR/sage_backend"

          # ── Disable sandbox ────────────────────────────────
          ENTITLEMENTS="macos/Runner/Release.entitlements"
          if [ -f "$ENTITLEMENTS" ]; then
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.app-sandbox" "$ENTITLEMENTS" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.app-sandbox bool false" "$ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$ENTITLEMENTS" 2>/dev/null || true
          fi

          # ── Icons ──────────────────────────────────────────
          mkdir StockD.iconset
          sips -z 16   16   assets/images/StockD.png --out StockD.iconset/icon_16x16.png
          sips -z 32   32   assets/images/StockD.png --out StockD.iconset/icon_16x16@2x.png
          sips -z 32   32   assets/images/StockD.png --out StockD.iconset/icon_32x32.png
          sips -z 64   64   assets/images/StockD.png --out StockD.iconset/icon_32x32@2x.png
          sips -z 128  128  assets/images/StockD.png --out StockD.iconset/icon_128x128.png
          sips -z 256  256  assets/images/StockD.png --out StockD.iconset/icon_128x128@2x.png
          sips -z 256  256  assets/images/StockD.png --out StockD.iconset/icon_256x256.png
          sips -z 512  512  assets/images/StockD.png --out StockD.iconset/icon_256x256@2x.png
          sips -z 512  512  assets/images/StockD.png --out StockD.iconset/icon_512x512.png
          sips -z 1024 1024 assets/images/StockD.png --out StockD.iconset/icon_512x512@2x.png
          iconutil -c icns StockD.iconset
          cp StockD.icns "$APP/Contents/Resources/AppIcon.icns"

          # ── DMG ────────────────────────────────────────────
          brew install create-dmg
          create-dmg \
            --volname "StockD Installer" \
            --volicon "StockD.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "StockD.app" 200 190 \
            --hide-extension "StockD.app" \
            --app-drop-link 600 190 \
            "StockD-mac-arm.dmg" \
            "$APP"

          # ── Split if oversized ─────────────────────────────
          if [ "$(stat -f%z StockD-mac-arm.dmg)" -gt 1992294400 ]; then
            split -b 1900M StockD-mac-arm.dmg StockD-mac-arm.dmg.part_
            rm StockD-mac-arm.dmg
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "StockD-1.2.0"
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            StockD-mac-arm.dmg
            StockD-mac-arm.dmg.part_*

  # =========================================================
  # INTEL (x64)
  # =========================================================
  macos-intel:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos-intel' }}
    runs-on: macos-15-intel
    env: { TARGET: "macos-intel", ARCH: "x64" }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build and Package
        run: |
          export MACOSX_DEPLOYMENT_TARGET="11.0"
          export CFLAGS="-mmacosx-version-min=11.0"
          export CXXFLAGS="-mmacosx-version-min=11.0"
          export LDFLAGS="-mmacosx-version-min=11.0"

          # ── Python standalone ──────────────────────────────
          PYTHON_URL="https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-x86_64-apple-darwin-install_only.tar.gz"
          curl -L "$PYTHON_URL" -o python.tar.gz
          mkdir -p backend_bundle/artifacts
          tar -xzf python.tar.gz -C backend_bundle/ --strip-components=1
          ./backend_bundle/bin/python3 -m ensurepip
