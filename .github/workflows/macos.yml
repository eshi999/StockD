          ./backend_bundle/bin/pip install tensorflow fastapi uvicorn pandas scikit-learn yfinance numpy peewee joblib

          # ── ML source and artifacts ────────────────────────
          cp ML/*.py backend_bundle/ 2>/dev/null || true
          cp ML/artifacts/*.json backend_bundle/artifacts/ 2>/dev/null || true
          cp ML/artifacts/*.weights.h5 backend_bundle/artifacts/ 2>/dev/null || true
          cp ML/artifacts/*.joblib backend_bundle/artifacts/ 2>/dev/null || true
          cp ML/artifacts/*.pkl backend_bundle/artifacts/ 2>/dev/null || true
          cp ML/artifacts/*.keras backend_bundle/artifacts/ 2>/dev/null || true

          # ── Flutter build ──────────────────────────────────
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --build-name=1.2.0 --build-number=1 \
            --dart-define=MACOSX_DEPLOYMENT_TARGET=11.0

          # ── Inject backend into app bundle ─────────────────
          APP="build/macos/Build/Products/Release/StockD.app"
          BUNDLE_DIR="$APP/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
          mkdir -p "$BUNDLE_DIR"
          cp -R backend_bundle/* "$BUNDLE_DIR/"

          # ── Launcher (sage_backend) ────────────────────────
          cat > "$BUNDLE_DIR/sage_backend" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export ML_DIR="$SCRIPT_DIR"
          export PYTHONPATH="$SCRIPT_DIR:$PYTHONPATH"
          exec "$SCRIPT_DIR/bin/python3" "$SCRIPT_DIR/main.py" "$@"
          EOF
          chmod +x "$BUNDLE_DIR/sage_backend"

          # ── Disable sandbox ────────────────────────────────
          ENTITLEMENTS="macos/Runner/Release.entitlements"
          if [ -f "$ENTITLEMENTS" ]; then
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.app-sandbox" "$ENTITLEMENTS" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.app-sandbox bool false" "$ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$ENTITLEMENTS" 2>/dev/null || true
          fi

          # ── Icons ──────────────────────────────────────────
          mkdir StockD.iconset
          sips -z 16   16   assets/images/StockD.png --out StockD.iconset/icon_16x16.png
          sips -z 32   32   assets/images/StockD.png --out StockD.iconset/icon_16x16@2x.png
          sips -z 32   32   assets/images/StockD.png --out StockD.iconset/icon_32x32.png
          sips -z 64   64   assets/images/StockD.png --out StockD.iconset/icon_32x32@2x.png
          sips -z 128  128  assets/images/StockD.png --out StockD.iconset/icon_128x128.png
          sips -z 256  256  assets/images/StockD.png --out StockD.iconset/icon_128x128@2x.png
          sips -z 256  256  assets/images/StockD.png --out StockD.iconset/icon_256x256.png
          sips -z 512  512  assets/images/StockD.png --out StockD.iconset/icon_256x256@2x.png
          sips -z 512  512  assets/images/StockD.png --out StockD.iconset/icon_512x512.png
          sips -z 1024 1024 assets/images/StockD.png --out StockD.iconset/icon_512x512@2x.png
          iconutil -c icns StockD.iconset
