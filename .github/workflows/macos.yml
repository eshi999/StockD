name: macOS Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64

permissions:
  contents: write

jobs:

  # =========================
  # ARM64 (Apple Silicon)
  # =========================
  build-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos-arm64' }}
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          set -euo pipefail
          brew install npm imagemagick

      - name: Build macOS App
        run: |
          set -euo pipefail

          mkdir -p backend_bundle/artifacts

          curl -L "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-aarch64-apple-darwin-install_only.tar.gz" -o python_mac.tar.gz
          tar -xzf python_mac.tar.gz -C backend_bundle/ --strip-components=1

          ./backend_bundle/bin/python3 -m pip install --upgrade pip

          ./backend_bundle/bin/pip install \
            tensorflow \
            tensorflow-metal \
            fastapi \
            uvicorn \
            pandas \
            scikit-learn \
            yfinance \
            numpy \
            peewee \
            joblib

          cp ML/*.py backend_bundle/
          cp ML/artifacts/*.json ML/artifacts/*.weights.h5 ML/artifacts/*.joblib backend_bundle/artifacts/

          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --build-name="1.2.0" --build-number=1

          APP_DIR="build/macos/Build/Products/Release/StockD.app"
          BUNDLE_DIR="$APP_DIR/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"

          mkdir -p "$BUNDLE_DIR"
          cp -R backend_bundle/* "$BUNDLE_DIR/"

          # =========================
          # Launcher (safe echo version)
          # =========================
          echo '#!/bin/bash' > "$BUNDLE_DIR/sage_launcher.sh"
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> "$BUNDLE_DIR/sage_launcher.sh"
          echo 'export ML_DIR="$SCRIPT_DIR"' >> "$BUNDLE_DIR/sage_launcher.sh"
          echo 'export PYTHONPATH="$SCRIPT_DIR:$PYTHONPATH"' >> "$BUNDLE_DIR/sage_launcher.sh"
          echo 'exec "$SCRIPT_DIR/bin/python3" "$SCRIPT_DIR/main.py" "$@"' >> "$BUNDLE_DIR/sage_launcher.sh"

          chmod +x "$BUNDLE_DIR/sage_launcher.sh"

          # =========================
          # ICON (ImageMagick ONLY, no temp file)
          # =========================
          ICON_SRC="assets/images/StockD.png"
          ICONSET="StockD.iconset"

          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"

          magick "$ICON_SRC" -resize 16x16     "$ICONSET/icon_16x16.png"
          magick "$ICON_SRC" -resize 32x32     "$ICONSET/icon_16x16@2x.png"
          magick "$ICON_SRC" -resize 32x32     "$ICONSET/icon_32x32.png"
          magick "$ICON_SRC" -resize 64x64     "$ICONSET/icon_32x32@2x.png"
          magick "$ICON_SRC" -resize 128x128   "$ICONSET/icon_128x128.png"
          magick "$ICON_SRC" -resize 256x256   "$ICONSET/icon_128x128@2x.png"
          magick "$ICON_SRC" -resize 256x256   "$ICONSET/icon_256x256.png"
          magick "$ICON_SRC" -resize 512x512   "$ICONSET/icon_256x256@2x.png"
          magick "$ICON_SRC" -resize 512x512   "$ICONSET/icon_512x512.png"
          magick "$ICON_SRC" -resize 1024x1024 "$ICONSET/icon_512x512@2x.png"

          find "$ICONSET" -type f -name "*.png" -exec magick {} -strip {} \;

          iconutil -c icns "$ICONSET" -o StockD.icns

          cp StockD.icns "$APP_DIR/Contents/Resources/AppIcon.icns"

          # =========================
          # DMG (hdiutil - stable)
          # =========================
          STAGING="dmg_staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          cp -R "$APP_DIR" "$STAGING/StockD.app"
          ln -s /Applications "$STAGING/Applications"

          DMG_NAME="StockD-macOS-arm64.dmg"

          hdiutil create "$DMG_NAME" \
            -volname "StockD Installer" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO

          rm -rf "$STAGING"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          files: StockD-macOS-arm64.dmg


  # =========================
  # X64 (Intel)
  # =========================
  build-x64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos-x64' }}
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          set -euo pipefail
          brew install npm imagemagick

      - name: Build macOS App
        run: |
          set -euo pipefail

          mkdir -p backend_bundle/artifacts

          curl -L "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-x86_64-apple-darwin-install_only.tar.gz" -o python_mac.tar.gz
          tar -xzf python_mac.tar.gz -C backend_bundle/ --strip-components=1

          ./backend_bundle/bin/python3 -m pip install --upgrade pip

          ./backend_bundle/bin/pip install \
            tensorflow \
            fastapi \
            uvicorn \
            pandas \
            scikit-learn \
            yfinance \
            numpy \
            peewee \
            joblib

          cp ML/*.py backend_bundle/
          cp ML/artifacts/*.json ML/artifacts/*.weights.h5 ML/artifacts/*.joblib backend_bundle/artifacts/

          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --build-name="1.2.0" --build-number=1

          APP_DIR="build/macos/Build/Products/Release/StockD.app"
          BUNDLE_DIR="$APP_DIR/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"

          mkdir -p "$BUNDLE_DIR"
          cp -R backend_bundle/* "$BUNDLE_DIR/"

          # =========================
          # Launcher
          # =========================
          echo '#!/bin/bash' > "$BUNDLE_DIR/sage_launcher.sh"
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> "$BUNDLE_DIR/sage_launcher.sh"
          echo 'export ML_DIR="$SCRIPT_DIR"' >> "$BUNDLE_DIR/sage_launcher.sh"
          echo 'export PYTHONPATH="$SCRIPT_DIR:$PYTHONPATH"' >> "$BUNDLE_DIR/sage_launcher.sh"
          echo 'exec "$SCRIPT_DIR/bin/python3" "$SCRIPT_DIR/main.py" "$@"' >> "$BUNDLE_DIR/sage_launcher.sh"

          chmod +x "$BUNDLE_DIR/sage_launcher.sh"

          # =========================
          # ICON (ImageMagick ONLY)
          # =========================
          ICON_SRC="assets/images/StockD.png"
          ICONSET="StockD.iconset"

          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"

          magick "$ICON_SRC" -resize 16x16     "$ICONSET/icon_16x16.png"
          magick "$ICON_SRC" -resize 32x32     "$ICONSET/icon_16x16@2x.png"
          magick "$ICON_SRC" -resize 32x32     "$ICONSET/icon_32x32.png"
          magick "$ICON_SRC" -resize 64x64     "$ICONSET/icon_32x32@2x.png"
          magick "$ICON_SRC" -resize 128x128   "$ICONSET/icon_128x128.png"
          magick "$ICON_SRC" -resize 256x256   "$ICONSET/icon_128x128@2x.png"
          magick "$ICON_SRC" -resize 256x256   "$ICONSET/icon_256x256.png"
          magick "$ICON_SRC" -resize 512x512   "$ICONSET/icon_256x256@2x.png"
          magick "$ICON_SRC" -resize 512x512   "$ICONSET/icon_512x512.png"
          magick "$ICON_SRC" -resize 1024x1024 "$ICONSET/icon_512x512@2x.png"

          find "$ICONSET" -type f -name "*.png" -exec magick {} -strip {} \;

          iconutil -c icns "$ICONSET" -o StockD.icns

          cp StockD.icns "$APP_DIR/Contents/Resources/AppIcon.icns"

          # =========================
          # DMG (hdiutil)
          # =========================
          STAGING="dmg_staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          cp -R "$APP_DIR" "$STAGING/StockD.app"
          ln -s /Applications "$STAGING/Applications"

          DMG_NAME="StockD-macOS-x64.dmg"

          hdiutil create "$DMG_NAME" \
            -volname "StockD Installer" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO

          rm -rf "$STAGING"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: StockD-macOS-x64.dmg
