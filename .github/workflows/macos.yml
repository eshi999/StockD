name: macOS Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            python_url: "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-aarch64-apple-darwin-install_only.tar.gz"
          - target: macos-x64
            os: macos-15-intel
            python_url: "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-x86_64-apple-darwin-install_only.tar.gz"
    
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: brew install imagemagick

      - name: Patch macOS Configs (Runner-level)
        run: |
          # Disable Sandbox for backend process execution
          for ENTITLEMENTS in macos/Runner/*.entitlements; do
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$ENTITLEMENTS"
          done
          
          # Force Monterey (12.0) minimum deployment target
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 12.0" macos/Runner/Info.plist

      - name: Build macOS App
        run: |
          set -euo pipefail

          # 1. Prepare Backend
          mkdir -p backend_bundle/artifacts
          curl -L "${{ matrix.python_url }}" -o python_mac.tar.gz
          tar -xzf python_mac.tar.gz -C backend_bundle/ --strip-components=1
          ./backend_bundle/bin/python3 -m pip install --upgrade pip
          ./backend_bundle/bin/pip install tensorflow tensorflow-metal fastapi uvicorn pandas scikit-learn yfinance numpy peewee joblib

          cp ML/*.py backend_bundle/
          cp ML/artifacts/*.json ML/artifacts/*.weights.h5 ML/artifacts/*.joblib backend_bundle/artifacts/

          # 2. Build App
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --build-name="1.2.0" --build-number=1 --target-platform-version=12.0

          APP_DIR="build/macos/Build/Products/Release/StockD.app"
          BUNDLE_DIR="$APP_DIR/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
          mkdir -p "$BUNDLE_DIR"
          cp -R backend_bundle/* "$BUNDLE_DIR/"

          # 3. Create Hardened Launcher
          cat << 'EOF' > "$BUNDLE_DIR/sage_launcher.sh"
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          
          # Force Python to stay isolated within the bundle
          export PYTHONHOME="$SCRIPT_DIR"
          export PYTHONPATH="$SCRIPT_DIR:$SCRIPT_DIR/lib/python3.12/site-packages"
          export PYTHONUNBUFFERED=1
          export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION="python"
          
          exec "$SCRIPT_DIR/bin/python3" "$SCRIPT_DIR/main.py" "$@"
          EOF
          
          # 4. Fix Permissions, Icon, and Cache
          chmod -R +x "$BUNDLE_DIR"
          chmod +x "$BUNDLE_DIR/sage_launcher.sh"
          
          # Ensure icon registration
          iconutil -c icns StockD.iconset -o StockD.icns
          cp StockD.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          touch "$APP_DIR"

          # 5. Create DMG
          STAGING="dmg_staging"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "$APP_DIR" "$STAGING/StockD.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create "StockD-${{ matrix.target }}.dmg" -volname "StockD" -srcfolder "$STAGING" -ov -format UDZO

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: StockD-${{ matrix.target }}.dmg
