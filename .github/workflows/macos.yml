name: macOS Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    strategy:
      matrix:
        include:
          - arch: arm64
            target: macos-arm64
          - arch: x64
            target: macos-x64

    env:
      BUILD_TARGET: ${{ github.event.inputs.build_target }}

    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------
      # SAFE MATRIX FILTER (FIXES YOUR ORIGINAL ISSUE)
      # -------------------------------------------------
      - name: Matrix filter (skip unwanted builds)
        run: |
          set -e

          echo "Requested: $BUILD_TARGET"
          echo "Current matrix target: ${{ matrix.target }}"

          if [ "$BUILD_TARGET" != "all" ] && [ "$BUILD_TARGET" != "${{ matrix.target }}" ]; then
            echo "Skipping this job (matrix filter)"
            exit 0
          fi

      # -------------------------------------------------
      # FORCE macOS 11 ACROSS ENTIRE FLUTTER STACK
      # -------------------------------------------------
      - name: Enforce macOS 11 Deployment Target
        run: |
          set -e

          echo "Forcing macOS 11 deployment target"

          find . -name "project.pbxproj" -exec sed -i '' \
            's/MACOSX_DEPLOYMENT_TARGET = .*/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' {} +

          mkdir -p macos/Flutter

          for f in Debug Release Profile; do
            FILE="macos/Flutter/Flutter-${f}.xcconfig"
            touch "$FILE"

            if grep -q "MACOSX_DEPLOYMENT_TARGET" "$FILE"; then
              sed -i '' 's/MACOSX_DEPLOYMENT_TARGET=.*/MACOSX_DEPLOYMENT_TARGET=11.0/' "$FILE"
            else
              echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$FILE"
            fi
          done

          cd macos
          sed -i '' 's/platform :osx, .*/platform :osx, "11.0"/g' Podfile || true
          grep -q "platform :osx" Podfile || echo 'platform :osx, "11.0"' >> Podfile
          cd ..

      # -------------------------------------------------
      # FLUTTER SETUP
      # -------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Tools
        run: |
          brew install npm
          npm install -g create-dmg

      # -------------------------------------------------
      # BUILD BACKEND (ARCH SAFE)
      # -------------------------------------------------
      - name: Build Backend & App
        run: |
          set -e

          ARCH="${{ matrix.arch }}"

          if [ "$ARCH" = "arm64" ]; then
            PY_ARCH="aarch64"
          else
            PY_ARCH="x86_64"
          fi

          echo "Building backend for $ARCH ($PY_ARCH)"

          mkdir -p "backend_bundle_${ARCH}"

          curl -L \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.12.13+20260510-${PY_ARCH}-apple-darwin-install_only.tar.gz" \
            -o python.tar.gz

          tar -xzf python.tar.gz -C "backend_bundle_${ARCH}/" --strip-components=1

          PYTHON="./backend_bundle_${ARCH}/bin/python3"
          PIP="./backend_bundle_${ARCH}/bin/pip"

          $PYTHON -m pip install --upgrade pip

          COMMON_DEPS="fastapi uvicorn pandas scikit-learn yfinance numpy peewee joblib"

          if [ "$ARCH" = "arm64" ]; then
            echo "ARM build: installing tensorflow + tensorflow-metal"
            $PIP install tensorflow tensorflow-metal $COMMON_DEPS
          else
            echo "Intel build: installing CPU-only tensorflow"
            $PIP install tensorflow $COMMON_DEPS
          fi

          mkdir -p "backend_bundle_${ARCH}/artifacts"

          cp ML/*.py "backend_bundle_${ARCH}/"
          cp ML/artifacts/* "backend_bundle_${ARCH}/artifacts/" 2>/dev/null || true

          codesign --force --deep --sign - "backend_bundle_${ARCH}/bin/python3"

          # -------------------------------------------------
          # FLUTTER BUILD (macOS 11 SAFE)
          # -------------------------------------------------
          flutter config --enable-macos-desktop
          flutter clean
          rm -rf build/macos

          flutter pub get

          flutter build macos \
            --release \
            --build-name="1.2.0" \
            --build-number=1

          APP_DIR="build/macos/Build/Products/Release/StockD.app"
          BUNDLE_DIR="$APP_DIR/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"

          mkdir -p "$BUNDLE_DIR"
          cp -R "backend_bundle_${ARCH}/"* "$BUNDLE_DIR/"

          rm -f "$APP_DIR/Icon\r" || true

          cat > "$BUNDLE_DIR/sage_launcher.sh" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          LOG_FILE="$SCRIPT_DIR/backend_init.log"
          exec > >(tee -a "$LOG_FILE") 2>&1

          export ML_DIR="$SCRIPT_DIR"
          export PYTHONPATH="$SCRIPT_DIR:$PYTHONPATH"

          if [ ! -f "$SCRIPT_DIR/artifacts/weights.h5" ]; then
              echo "FATAL: Missing weights.h5"
              exit 1
          fi

          "$SCRIPT_DIR/bin/python3" -u "$SCRIPT_DIR/main.py" &
          BACKEND_PID=$!

          for i in {1..15}; do
              if curl -s http://localhost:8000/health | grep -q "ok"; then
                  echo "Backend operational."
                  break
              fi
              sleep 2
          done

          wait $BACKEND_PID
          EOF

          chmod +x "$BUNDLE_DIR/sage_launcher.sh"

          mkdir -p StockD.iconset

          sips -z 512 512 assets/images/StockD.png --out StockD.iconset/icon_512x512.png
          sips -z 256 256 assets/images/StockD.png --out StockD.iconset/icon_256x256.png
          sips -z 128 128 assets/images/StockD.png --out StockD.iconset/icon_128x128.png
          sips -z 64 64 assets/images/StockD.png --out StockD.iconset/icon_64x64.png

          iconutil -c icns StockD.iconset

          cp StockD.icns "$APP_DIR/Contents/Resources/AppIcon.icns"

          create-dmg \
            --volname "StockD" \
            --volicon StockD.icns \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "StockD.app" 150 200 \
            --app-drop-link 450 200 \
            "StockD-macOS-${ARCH}.dmg" \
            "$APP_DIR"

      # -------------------------------------------------
      # RELEASE
      # -------------------------------------------------
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          files: |
            StockD-macOS-*.dmg
