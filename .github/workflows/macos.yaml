name: macOS Build
on: workflow_dispatch
permissions: { contents: write }

jobs:
  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - name: Build and Package
        run: |
          flutter config --enable-macos-desktop
          mkdir -p backend_bundle
          mkdir StockD.iconset
          sips -z 16 16 assets/images/StockD.png --out StockD.iconset/icon_16x16.png
          sips -z 32 32 assets/images/StockD.png --out StockD.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/images/StockD.png --out StockD.iconset/icon_32x32.png
          sips -z 64 64 assets/images/StockD.png --out StockD.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/images/StockD.png --out StockD.iconset/icon_128x128.png
          sips -z 256 256 assets/images/StockD.png --out StockD.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/images/StockD.png --out StockD.iconset/icon_256x256.png
          sips -z 512 512 assets/images/StockD.png --out StockD.iconset/icon_512x512.png
          iconutil -c icns StockD.iconset -o backend_bundle/icon.icns
          wget -q https://github.com/astral-sh/python-build-standalone/releases/download/20250317/cpython-3.12.9+20250317-x86_64-apple-darwin-install_only.tar.gz
          tar -xzf *.tar.gz -C backend_bundle/ --strip-components=1
          ./backend_bundle/bin/python3 -m ensurepip
          ./backend_bundle/bin/pip install tensorflow fastapi uvicorn pandas scikit-learn yfinance numpy peewee
          find . -name "Project.pbxproj" -exec sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = .*/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' {} +
          cp ML/main.py ML/sage_bridge.py ML/ml_config.py ML/sage_model.keras ML/sage_model_best.keras ML/calibration.pkl ML/feature_scaler.pkl backend_bundle/ 2>/dev/null || true
          cp -r ML/artifacts/ backend_bundle/ 2>/dev/null || true
          
          flutter build macos --release --build-name=1.2.0 --build-number=1
          cp backend_bundle/icon.icns "build/macos/Build/Products/Release/StockD.app/Contents/Resources/AppIcon.icns"
          
          # Fix: Corrected macOS bundle path
          BUNDLE_FRAMEWORKS="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets"
          mkdir -p "$BUNDLE_FRAMEWORKS/backend_bundle"
          cp -r backend_bundle/* "$BUNDLE_FRAMEWORKS/backend_bundle/"
          
          # Left-aligned heredoc, fixed macOS path resolution
          cat > "$BUNDLE_FRAMEWORKS/backend_bundle/sage_launcher.sh" << 'EOF'
          #!/bin/bash
          BUNDLE_DIR="$(cd "$(dirname "$0")" && pwd)"
          export ML_DIR="$BUNDLE_DIR"
          exec "$BUNDLE_DIR/bin/python3" "$BUNDLE_DIR/main.py"
          EOF
          chmod +x "$BUNDLE_FRAMEWORKS/backend_bundle/sage_launcher.sh"
          
          brew install create-dmg
          create-dmg --volname "StockD Installer (Intel)" --app-drop-link 400 200 --icon "StockD.app" 200 200 --background "assets/images/StockD.png" "StockD-mac-intel-1.2.0.dmg" "build/macos/Build/Products/Release/StockD.app"
      - name: Split and Release
        run: |
          if [ $(stat -f%z StockD-mac-intel-1.2.0.dmg) -gt 1992294400 ]; then
             split -b 1900M StockD-mac-intel-1.2.0.dmg StockD-mac-intel-1.2.0.dmg.part
             rm StockD-mac-intel-1.2.0.dmg
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          files: |
            StockD-mac-intel-1.2.0.dmg
            *.part*

