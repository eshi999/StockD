name: Build StockD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:

          # Linux
          - name: linux-nvidia
            os: ubuntu-latest
            tf_packages: tensorflow
            flutter_platform: linux

          - name: linux-amd
            os: ubuntu-latest
            tf_packages: tensorflow
            flutter_platform: linux

          - name: linux-intel
            os: ubuntu-latest
            tf_packages: tensorflow intel-extension-for-tensorflow
            flutter_platform: linux

          # macOS (Metal handles Intel iGPU + AMD eGPU via Thunderbolt + Apple Silicon)
          - name: mac-intel
            os: macos-15-intel
            tf_packages: tensorflow-macos tensorflow-metal
            flutter_platform: macos

          - name: mac-arm
            os: macos-15
            tf_packages: tensorflow-macos tensorflow-metal
            flutter_platform: macos

          # Windows (ROCm is Linux-only; AMD falls back to CPU-optimized TF)
          - name: windows-nvidia
            os: windows-latest
            tf_packages: tensorflow
            flutter_platform: windows

          - name: windows-amd
            os: windows-latest
            tf_packages: tensorflow
            flutter_platform: windows

          - name: windows-intel
            os: windows-latest
            tf_packages: tensorflow intel-extension-for-tensorflow
            flutter_platform: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: 'pip'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}

      # --- Build Backend: Unix -------------------------------------------
      - name: Build Backend (Unix)
        if: matrix.flutter_platform != 'windows'
        run: |
          python -m pip install pyinstaller ${{ matrix.tf_packages }} scikit-learn pandas yfinance
          cd ML
          python -m PyInstaller --name sage_backend --onedir --noconsole --clean --strip \
            --add-data "artifacts:artifacts" \
            --exclude-module tensorboard \
            --exclude-module tensorflow_estimator \
            --exclude-module tensorflow.python.debug \
            --exclude-module tensorflow.lite.experimental \
            main.py
          du -sh dist/sage_backend/

      # --- Build Backend: Windows ----------------------------------------
      - name: Build Backend (Windows)
        if: matrix.flutter_platform == 'windows'
        shell: powershell
        run: |
          python -m pip install pyinstaller ${{ matrix.tf_packages }} scikit-learn pandas yfinance
          cd ML
          python -m PyInstaller --name sage_backend --onedir --noconsole --clean --strip `
            --add-data "artifacts;artifacts" `
            --exclude-module tensorboard `
            --exclude-module tensorflow_estimator `
            --exclude-module tensorflow.python.debug `
            --exclude-module tensorflow.lite.experimental `
            main.py

      # --- Package: Linux ------------------------------------------------
      - name: Install Linux Deps
        if: matrix.flutter_platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm

      - name: Package Linux
        if: matrix.flutter_platform == 'linux'
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r ML/dist/sage_backend/* $BUNDLE/data/flutter_assets/backend_bundle/

          # DEB
          DEB_ROOT=build/linux/deb/StockD
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD $DEB_ROOT/usr/share/applications
          tar -C $BUNDLE -cf - . | tar -xf - -C $DEB_ROOT/usr/lib/StockD/

          cat > $DEB_ROOT/usr/share/applications/stockd.desktop << 'EOF'
           [Desktop Entry]
           Name=StockD
           Exec=/usr/bin/stockd
           Type=Application
           Categories=Finance;Education;
          EOF

          ln -s /usr/lib/StockD/stockd $DEB_ROOT/usr/bin/stockd
          chmod 755 \
            $DEB_ROOT/usr/lib/StockD/stockd \
            $DEB_ROOT/usr/lib/StockD/data/flutter_assets/backend_bundle/sage_backend

          cat > $DEB_ROOT/DEBIAN/control << 'EOF'
           Package: stockd
           Version: 1.2.0
           Architecture: amd64
           Maintainer: Gautam Mahajan
           Description: AI Stock App
           Depends: libgtk-3-0
          EOF

          dpkg-deb --root-owner-group -Znone --build $DEB_ROOT StockD-${{ matrix.name }}.deb

          # RPM
          RPM_ROOT=$HOME/rpmbuild
          mkdir -p $RPM_ROOT/{SPECS,SOURCES,BUILD,BUILDROOT,RPMS}
          tar -czf $RPM_ROOT/SOURCES/StockD-1.2.0.tar.gz -C $BUNDLE .

          cat > $RPM_ROOT/SPECS/StockD.spec << 'EOF'
           Name:    StockD
           Version: 1.2.0
           Release: 1
           Summary: StockD App
           BuildArch: x86_64
           License: Proprietary
           Source0: StockD-1.2.0.tar.gz

           %description
           AI Coach.

           %prep
           %setup -c -n StockD-1.2.0

           %install
           mkdir -p %{buildroot}/usr/lib/StockD %{buildroot}/usr/bin %{buildroot}/usr/share/applications
           cp -r StockD-1.2.0/* %{buildroot}/usr/lib/StockD/
           chmod 755 \
             %{buildroot}/usr/lib/StockD/stockd \
             %{buildroot}/usr/lib/StockD/data/flutter_assets/backend_bundle/sage_backend
           ln -s /usr/lib/StockD/stockd %{buildroot}/usr/bin/stockd
           echo -e " [Desktop Entry]\n Name=StockD\n Exec=/usr/bin/stockd\n Type=Application\n Categories=Finance;" \
             > %{buildroot}/usr/share/applications/stockd.desktop

           %files
           /usr/lib/StockD
           /usr/bin/stockd
           /usr/share/applications/stockd.desktop
          EOF

          rpmbuild -bb --define "__strip /bin/true" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/x86_64/StockD-1.2.0-1.x86_64.rpm StockD-${{ matrix.name }}-1.2.0.rpm

      - name: Upload Linux Packages
        if: matrix.flutter_platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: StockD-${{ matrix.name }}-pkgs
          path: |
            StockD-${{ matrix.name }}.deb
            StockD-${{ matrix.name }}-1.2.0.rpm

      # --- Package: macOS ------------------------------------------------
      - name: Package macOS
        if: matrix.flutter_platform == 'macos'
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          find build/macos/Build/Products/Release/StockD.app -name "*.dSYM" -exec rm -rf {} +
          DEST_DIR="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
          mkdir -p "$DEST_DIR"
          cp -r ML/dist/sage_backend/* "$DEST_DIR/"
          rm -f StockD-${{ matrix.name }}.dmg
          sleep 2
          hdiutil create \
            -volname "StockD-${{ matrix.name }}" \
            -srcfolder build/macos/Build/Products/Release/StockD.app \
            -ov -format UDRW \
            StockD-${{ matrix.name }}.dmg

      - name: Upload macOS Package
        if: matrix.flutter_platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: StockD-${{ matrix.name }}
          path: StockD-${{ matrix.name }}.dmg

      # --- Package: Windows ----------------------------------------------
      - name: Package Windows
        if: matrix.flutter_platform == 'windows'
        shell: powershell
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          $bundlePath = "build\windows\x64\runner\Release"
          $assetsPath = "$bundlePath\data\flutter_assets\backend_bundle"
          New-Item -ItemType Directory -Force -Path $assetsPath
          Copy-Item -Path "ML\dist\sage_backend\*" -Destination $assetsPath -Recurse

      - name: Install NSIS
        if: matrix.flutter_platform == 'windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows Installer
        if: matrix.flutter_platform == 'windows'
        shell: powershell
        run: |
          @"
          Name "StockD"
          OutFile "StockD-${{ matrix.name }}-setup.exe"
          InstallDir "`$PROGRAMFILES64\StockD"
          Section
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            CreateShortcut "`$DESKTOP\StockD.lnk" "`$INSTDIR\StockD.exe"
          SectionEnd
          "@ | Out-File -Encoding ASCII StockD.nsi
          makensis.exe StockD.nsi

      - name: Upload Windows Installer
        if: matrix.flutter_platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: StockD-${{ matrix.name }}
          path: StockD-${{ matrix.name }}-setup.exe
