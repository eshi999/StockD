name: StockD Multi-Platform Build Pipeline
  
on:
  workflow_dispatch: 
    inputs:
      build_windows:
        description: "Build Windows (Self-Hosted)"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS (GitHub Cloud)"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux (Self-Hosted)"
        type: boolean
        default: true

env:
  FORCE_JUST_ACTIONS_TO_NODE24: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  setup-matrix:
    name: Configure OS Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix JSON
        id: set-matrix
        shell: python
        run: |
          import json
          import os

          event = "${{ github.event_name }}"
          win = "${{ inputs.build_windows }}" == "true" or event != "workflow_dispatch"
          mac = "${{ inputs.build_macos }}" == "true" or event != "workflow_dispatch"
          lin = "${{ inputs.build_linux }}" == "true" or event != "workflow_dispatch"

          matrix = []
          
          if win:
              matrix.append({"id": "windows-x64", "os": ["self-hosted", "windows", "x64"], "platform": "windows", "arch": "x64", "pkgs": "tensorflow>=2.16.1", "python_ver": "3.12"})
          
          if mac:
              matrix.append({"id": "mac-arm", "os": "macos-15", "platform": "macos", "arch": "arm64", "pkgs": "tensorflow tensorflow-metal", "python_ver": "3.12", "mac_pkg": "3.12.3"})
              matrix.append({"id": "mac-intel", "os": "macos-15-intel", "platform": "macos", "arch": "x64", "pkgs": "tensorflow", "python_ver": "3.12", "mac_pkg": "3.12.3"})
          
          if lin:
              matrix.append({"id": "linux-x64-nvidia", "os": ["self-hosted", "linux", "x64"], "platform": "linux", "arch": "x64", "deb_arch": "amd64", "rpm_arch": "x86_64", "pkgs": "tensorflow[and-cuda]", "python_ver": "3.12"})
              matrix.append({"id": "linux-x64-amd", "os": ["self-hosted", "linux", "x64"], "platform": "linux", "arch": "x64", "deb_arch": "amd64", "rpm_arch": "x86_64", "pkgs": "tensorflow", "python_ver": "3.12"})
              matrix.append({"id": "linux-x64-intel", "os": ["self-hosted", "linux", "x64"], "platform": "linux", "arch": "x64", "deb_arch": "amd64", "rpm_arch": "x86_64", "pkgs": "tensorflow intel-extension-for-tensorflow", "python_ver": "3.12"})
              matrix.append({"id": "linux-arm64", "os": ["self-hosted", "linux", "arm64"], "platform": "linux", "arch": "arm64", "deb_arch": "arm64", "rpm_arch": "aarch64", "pkgs": "tensorflow", "python_ver": "3.12"})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  build:
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.matrix != '[]' }}
    name: Build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # UPDATED PYTHON STEP: Skips Installer to avoid Admin/Registry issues
      - name: Setup Python (Local)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if ! command -v python &> /dev/null; then
              echo "Error: Python not found on system path!"
              exit 1
          fi
          python -m pip install --upgrade pip

      - name: Setup Python (macOS Cloud)
        if: runner.os == 'macOS'
        run: |
          curl -O https://www.python.org/ftp/python/${{ matrix.mac_pkg }}/python-${{ matrix.mac_pkg }}-macos11.pkg
          sudo installer -pkg python-${{ matrix.mac_pkg }}-macos11.pkg -target /

      - name: Setup Flutter (Standard)
        if: matrix.id != 'linux-arm64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Flutter (Linux ARM64 Manual Clone)
        if: matrix.id == 'linux-arm64'
        run: |
          git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          $HOME/flutter/bin/flutter precache

      - name: Cache Nuitka C-Compiler Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~\AppData\Local\Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('ML/requirements.txt', '.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-
      
      - name: Compile Nuitka (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        shell: bash
        run: |
          PY_CMD="/Library/Frameworks/Python.framework/Versions/${{ matrix.python_ver }}/bin/python3"
          $PY_CMD -m pip install nuitka zstandard ordered-set ${{ matrix.pkgs }} "numpy<2" "protobuf<=3.20.3" scikit-learn pandas yfinance fastapi uvicorn
          cd ML
          $PY_CMD -m nuitka --standalone --assume-yes-for-downloads --remove-output --output-dir=dist --include-data-dir=artifacts=artifacts --plugin-enable=anti-bloat --allow-embedding-compiled-modules --lto=yes --jobs=4 --nofollow-import-to=tensorboard --nofollow-import-to=tensorflow_estimator --nofollow-import-to=tensorflow.compiler --nofollow-import-to=tensorflow.lite --nofollow-import-to=unittest --nofollow-import-to=pydoc main.py
          mkdir -p ../backend
          cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend || true
          rm -rf dist

      - name: Compile Nuitka (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install nuitka zstandard ordered-set ${{ matrix.pkgs }} "numpy<2" "protobuf<=3.20.3" scikit-learn pandas yfinance fastapi uvicorn
          cd ML
          python -m nuitka --standalone --assume-yes-for-downloads --remove-output --output-dir=dist --include-data-dir=artifacts=artifacts --plugin-enable=anti-bloat --allow-embedding-compiled-modules --lto=yes --jobs=14 --nofollow-import-to=tensorboard --nofollow-import-to=tensorflow_estimator --nofollow-import-to=tensorflow.compiler --nofollow-import-to=tensorflow.lite --nofollow-import-to=unittest --nofollow-import-to=pydoc main.py
          mkdir -p ../backend
          cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend || true
          rm -rf dist

      - name: Compile Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install nuitka zstandard ordered-set ${{ matrix.pkgs }} scikit-learn pandas yfinance fastapi uvicorn
          cd ML
          python -m nuitka --standalone --assume-yes-for-downloads --remove-output --output-dir=dist --include-data-dir=artifacts=artifacts --plugin-enable=anti-bloat --allow-embedding-compiled-modules --lto=yes --jobs=14 --nofollow-import-to=tensorboard --nofollow-import-to=tensorflow_estimator --nofollow-import-to=tensorflow.compiler --nofollow-import-to=tensorflow.lite --nofollow-import-to=unittest --nofollow-import-to=pydoc main.py
          mkdir -p ../backend
          cp -r dist/main.dist/* ../backend/
          mv ../backend/main.exe ../backend/sage_backend.exe || true
          rm -rf dist

      - name: Build Windows Stage
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          $assets = "build\windows\x64\runner\Release\data\flutter_assets\backend_bundle"
          New-Item -ItemType Directory -Force -Path $assets
          Copy-Item -Path "backend\*" -Destination $assets -Recurse
          choco install nsis -y --no-progress
          magick "assets\images\StockD.png" -define icon:auto-resize=256,128,64,48,32,16 "nsis_icon.ico"
          @"
          !include "MUI2.nsh"
          Name "StockD"
          OutFile "StockD-${{ matrix.id }}-setup.exe"
          InstallDir "`$PROGRAMFILES64\StockD"
          !define MUI_ICON "nsis_icon.ico"
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            CreateShortcut "`$DESKTOP\StockD.lnk" "`$INSTDIR\StockD.exe"
          SectionEnd
          "@ | Out-File -Encoding ASCII StockD.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" StockD.nsi

      - name: Build macOS Stage
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          DEST="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
          mkdir -p "$DEST" && cp -r backend/* "$DEST/"
          brew install create-dmg
          create-dmg --volname "StockD-${{ matrix.id }}" "StockD-${{ matrix.id }}.dmg" "build/macos/Build/Products/Release/StockD.app" || true

      - name: Build Linux Stage
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          # (Add packaging logic as needed...)

      - name: Cleanup Workspace
        if: always()
        shell: bash
        run: rm -rf ${{ github.workspace }}/*
