name: Build StockD

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform"
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - macos

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # STAGE 1: Build SAGE Backend (Once)
  # ──────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build SAGE Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: 'pip'}
      - name: Install & Compile
        run: |
          python -m pip install pyinstaller tensorflow scikit-learn pandas yfinance
          cd ML
          python -m PyInstaller --name sage_backend --onedir --noconsole --clean --add-data "artifacts:artifacts" main.py
      - name: Upload Backend
        uses: actions/upload-artifact@v4
        with:
          name: sage-backend-bundle
          path: ML/dist/sage_backend/

  # ──────────────────────────────────────────────────────────────────────────
  # STAGE 2: Parallel Packaging
  # ──────────────────────────────────────────────────────────────────────────
  package-linux:
    needs: build-backend
    runs-on: ubuntu-latest
    if: inputs.target == 'linux'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - uses: actions/download-artifact@v4
        with: {name: sage-backend-bundle, path: backend}

      # ADD THIS STEP HERE:
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: |
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          mkdir -p build/linux/x64/bundle/data/flutter_assets/backend_bundle
          cp -r backend/* build/linux/x64/bundle/data/flutter_assets/backend_bundle/
          
      - name: Build Packages
        run: |
          # 1. DEB Packaging
          DEB_ROOT=build/linux/deb/stockd
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/stockd
          tar -C build/linux/x64/bundle -cf - . | tar -xf - -C $DEB_ROOT/usr/lib/stockd/
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd
          Version: 1.2.0
          Architecture: amd64
          Maintainer: Gautam Mahajan
          Description: AI Stock App
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT stockd-linux-x64.deb
          
          # 2. RPM Packaging
          RPM_ROOT=$HOME/rpmbuild
          mkdir -p $RPM_ROOT/{SPECS,SOURCES,BUILD,BUILDROOT,RPMS}
          tar -czf $RPM_ROOT/SOURCES/stockd-1.2.0.tar.gz -C build/linux/x64/bundle .
          cat > $RPM_ROOT/SPECS/stockd.spec << EOF
          %global __requires_exclude_from ^/usr/lib/stockd/.*$
          %global __provides_exclude_from ^/usr/lib/stockd/.*$
          %global _binaries_in_noarch_packages_terminate_build 0
          Name: stockd
          Version: 1.2.0
          Release: 1
          Summary: StockD App
          BuildArch: x86_64
          License: Proprietary
          %description
          AI Coach.
          %prep
          %setup -c
          %install
          mkdir -p %{buildroot}/usr/lib/stockd
          cp -r ./* %{buildroot}/usr/lib/stockd/
          %files
          /usr/lib/stockd
          EOF
          rpmbuild -bb $RPM_ROOT/SPECS/stockd.spec
      - uses: actions/upload-artifact@v4
        with: 
          name: stockd-linux-pkgs
          path: |
            stockd-linux-x64.deb
            /home/runner/rpmbuild/RPMS/x86_64/stockd-1.2.0-1.x86_64.rpm

  package-macos-intel:
    needs: build-backend
    runs-on: macos-15-intel
    if: inputs.target == 'macos'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - uses: actions/download-artifact@v4
        with: {name: sage-backend-bundle, path: backend}
      - run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          cp -r backend/* build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle/
          hdiutil create -volname "StockD-Intel" -srcfolder build/macos/Build/Products/Release/StockD.app -ov -format UDRW stockd-macos-intel.dmg
      - uses: actions/upload-artifact@v4
        with: {name: stockd-macos-intel, path: stockd-macos-intel.dmg}

  package-macos-arm:
    needs: build-backend
    runs-on: macos-15
    if: inputs.target == 'macos'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - uses: actions/download-artifact@v4
        with: {name: sage-backend-bundle, path: backend}
      - run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          cp -r backend/* build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle/
          hdiutil create -volname "StockD-Silicon" -srcfolder build/macos/Build/Products/Release/StockD.app -ov -format UDRW stockd-macos-arm.dmg
      - uses: actions/upload-artifact@v4
        with: {name: stockd-macos-arm, path: stockd-macos-arm.dmg}

  package-windows:
    needs: build-backend
    runs-on: windows-latest
    if: inputs.target == 'windows'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - uses: actions/download-artifact@v4
        with: {name: sage-backend-bundle, path: backend}
      - run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          $bundlePath = "build\windows\x64\runner\Release"
          $assetsPath = "$bundlePath\data\flutter_assets\backend_bundle"
          New-Item -ItemType Directory -Force -Path $assetsPath
          Copy-Item -Path "backend\*" -Destination $assetsPath -Recurse
      - name: Install NSIS
        uses: repolevedavaj/install-nsis@v1.0.3
        with:
          nsis-version: '3.11'
      - shell: powershell
        run: |
          @"
          Name "StockD"
          OutFile "stockd-windows-x64-setup.exe"
          InstallDir "$PROGRAMFILES64\StockD"
          Section
            SetOutPath "$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            CreateShortcut "$DESKTOP\StockD.lnk" "$INSTDIR\stockd.exe"
          SectionEnd
          "@ | Out-File -Encoding ASCII stockd.nsi
          makensis.exe stockd.nsi
      - uses: actions/upload-artifact@v4
        with: {name: stockd-windows-x64, path: stockd-windows-x64-setup.exe}
