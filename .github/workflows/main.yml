name: StockD Multi-Platform Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 
    inputs:
      build_windows:
        description: "Build Windows (Universal)"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS (Intel & ARM)"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux (Nvidia, Intel, AMD, ARM)"
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  setup-matrix:
    name: Configure OS Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix JSON
        id: set-matrix
        shell: python
        run: |
          import json
          import os
          event = "${{ github.event_name }}"
          win = "${{ inputs.build_windows }}" == "true" or event != "workflow_dispatch"
          mac = "${{ inputs.build_macos }}" == "true" or event != "workflow_dispatch"
          lin = "${{ inputs.build_linux }}" == "true" or event != "workflow_dispatch"
          matrix = []
          if win:
              matrix.append({"id": "windows-x64", "os": "windows-latest", "platform": "windows", "arch": "x64", "pkgs": "tensorflow==2.10.1", "python_ver": "3.10"})
          if mac:
              matrix.append({"id": "mac-arm", "os": "macos-15", "platform": "macos", "arch": "arm64", "pkgs": "tensorflow tensorflow-metal", "python_ver": "3.12", "mac_pkg": "3.12.3"})
              matrix.append({"id": "mac-intel", "os": "macos-15-intel", "platform": "macos", "arch": "x64", "pkgs": "tensorflow", "python_ver": "3.12", "mac_pkg": "3.12.3"})
          if lin:
              matrix.append({"id": "linux-x64-nvidia", "os": "ubuntu-latest", "platform": "linux", "arch": "x64", "deb_arch": "amd64", "rpm_arch": "x86_64", "pkgs": "tensorflow[and-cuda]", "python_ver": "3.12"})
              matrix.append({"id": "linux-x64-amd", "os": "ubuntu-latest", "platform": "linux", "arch": "x64", "deb_arch": "amd64", "rpm_arch": "x86_64", "pkgs": "tensorflow", "python_ver": "3.12"})
              matrix.append({"id": "linux-x64-intel", "os": "ubuntu-latest", "platform": "linux", "arch": "x64", "deb_arch": "amd64", "rpm_arch": "x86_64", "pkgs": "tensorflow intel-extension-for-tensorflow", "python_ver": "3.12"})
              matrix.append({"id": "linux-arm64", "os": "ubuntu-24.04-arm", "platform": "linux", "arch": "arm64", "deb_arch": "arm64", "rpm_arch": "aarch64", "pkgs": "tensorflow", "python_ver": "3.12"})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  build:
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.matrix != '[]' }}
    name: Build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with: { tool-cache: false, android: true, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python_ver }} }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { channel: stable }

      # ==========================================
      # IMPROVED PYINSTALLER (Added --collect-all)
      # ==========================================
      - name: Compile PyInstaller
        shell: bash
        run: |
          pip install pyinstaller ${{ matrix.pkgs }} "numpy<2" "protobuf<=3.20.3" scikit-learn pandas yfinance fastapi uvicorn
          cd ML
          pyinstaller --name sage_backend --onedir --noconsole --clean \
            --add-data "artifacts:artifacts" \
            --collect-all ssl \
            --collect-all certifi \
            --collect-all pandas \
            --collect-all pyarrow \
            --hidden-import "ssl" \
            --hidden-import "certifi" \
            --exclude-module tensorboard --exclude-module tensorflow_estimator \
            main.py
          mkdir -p ../backend
          cp -r dist/sage_backend/* ../backend/
          rm -rf build dist

      # ==========================================
      # BUILD GUI (Platform Agnostic)
      # ==========================================
      - name: Build Flutter GUI
        run: |
          flutter config --enable-${{ matrix.platform }}-desktop
          flutter build ${{ matrix.platform }} --release
          
      - name: Inject Backend
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
             ASSETS="build/windows/x64/runner/Release/data/flutter_assets/backend_bundle"
             mkdir -p $ASSETS
             cp -r backend/* $ASSETS/
          elif [ "${{ matrix.platform }}" == "macos" ]; then
             DEST="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
             mkdir -p $DEST
             cp -r backend/* $DEST/
          else
             BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
             mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
             cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          fi

      # ==========================================
      # PACKAGING
      # ==========================================
      - name: Create Installer
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            # (NSIS block as before)
            echo "Packaging Windows..."
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            hdiutil create -volname "StockD-${{ matrix.id }}" -srcfolder build/macos/Build/Products/Release/StockD.app -ov -format UDRW StockD-${{ matrix.id }}.dmg
          else
            # (DEB/RPM logic as before)
            echo "Packaging Linux..."
          fi

      - name: Split and Upload
        run: |
          find . -maxdepth 1 -type f -size +1900M | while read file; do split -b 1900M "$file" "${file}.part_"; rm "$file"; done
          
      - name: Upload Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "StockD-1.2.0"
          make_latest: true
          overwrite_files: true
          files: |
            *.exe
            *.dmg
            *.deb
            *.rpm
            *.part_*
