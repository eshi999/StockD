name: StockD Multi-Platform Build Pipeline

on:
  workflow_dispatch:
    inputs:
      build_windows:
        type: boolean
        default: true
      build_macos:
        type: boolean
        default: true
      build_linux:
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: 1

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: python
        run: |
          import json, os
          win = "${{ inputs.build_windows }}" == "true"
          mac = "${{ inputs.build_macos }}" == "true"
          lin = "${{ inputs.build_linux }}" == "true"
          matrix = []
          # Windows
          if win: matrix.append({"id": "windows-x64", "os": "self-hosted", "platform": "windows", "arch": "x64", "jobs": 14, "tf_pkg": "tensorflow"})
          # MacOS
          if mac: 
              matrix.append({"id": "mac-arm64", "os": "macos-15", "platform": "macos", "arch": "arm64", "jobs": 4, "tf_pkg": "tensorflow tensorflow-metal"})
              matrix.append({"id": "mac-intel", "os": "macos-15", "platform": "macos", "arch": "x64", "jobs": 4, "tf_pkg": "tensorflow"})
          # Linux
          if lin: 
              matrix.append({"id": "linux-x64-nvidia", "os": "self-hosted", "platform": "linux", "arch": "x64", "jobs": 14, "tf_pkg": "tensorflow[and-cuda]"})
              matrix.append({"id": "linux-x64-intel", "os": "self-hosted", "platform": "linux", "arch": "x64", "jobs": 14, "tf_pkg": "tensorflow-intel"})
              matrix.append({"id": "linux-x64-amd", "os": "self-hosted", "platform": "linux", "arch": "x64", "jobs": 14, "tf_pkg": "tensorflow"})
              matrix.append({"id": "linux-arm64", "os": "ubuntu-24.04-arm", "platform": "linux", "arch": "arm64", "jobs": 4, "tf_pkg": "tensorflow"})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}")

  build:
    needs: setup-matrix
    if: ${{ fromJSON(needs.setup-matrix.outputs.matrix)[0] != null }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build backend (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          pip install nuitka zstandard ordered-set ${{ matrix.tf_pkg }} fastapi uvicorn pandas scikit-learn yfinance
          $TF_PATH = python -c "import tensorflow as tf; print(tf.sysconfig.get_lib())"
          python -m nuitka ML/main.py --standalone --assume-yes-for-downloads --output-dir=dist --jobs=${{ matrix.jobs }} --include-package=tensorflow --plugin-enable=anti-bloat --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite
          New-Item -ItemType Directory -Path "backend" -Force
          Copy-Item -Recurse -Path "dist/main.dist/*" -Destination "backend/"
          if (Test-Path "backend/main.exe") { Rename-Item "backend/main.exe" "sage_backend.exe" }

      - name: Build backend (Linux/Mac)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          pip install nuitka zstandard ordered-set ${{ matrix.tf_pkg }} fastapi uvicorn pandas scikit-learn yfinance
          cd ML && python -m nuitka main.py --standalone --assume-yes-for-downloads --output-dir=dist --jobs=${{ matrix.jobs }} --include-package=tensorflow --plugin-enable=anti-bloat --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend || true

      - name: Flutter build
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then flutter build windows --release
          elif [ "${{ matrix.platform }}" == "macos" ]; then flutter build macos --release
          else flutter build linux --release; fi

      - name: Inject backend
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            DEST="build/windows/x64/runner/Release/data/flutter_assets/backend_bundle"
            mkdir -p "$DEST" && cp -r backend/* "$DEST"
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            DEST="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
            mkdir -p "$DEST" && cp -r backend/* "$DEST"
          else
            DEST="build/linux/x64/release/bundle/data/flutter_assets/backend_bundle"
            mkdir -p "$DEST" && cp -r backend/* "$DEST"
          fi

      - name: Linux Packaging
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          mkdir -p package/usr/share/applications
          cat > package/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=stockd
          Icon=stockd
          Type=Application
          Categories=Finance;
          EOF
          mkdir -p deb/usr/lib/stockd deb/usr/bin
          cp -r "$BUNDLE"/* deb/usr/lib/stockd/
          ln -s /usr/lib/stockd/stockd deb/usr/bin/stockd || true
          cat > deb/DEBIAN/control << EOF
          Package: stockd
          Version: 1.0.0
          Architecture: amd64
          Maintainer: StockD
          Description: StockD AI App
          EOF
          dpkg-deb --build deb StockD-${{ matrix.id }}-${{ github.run_number }}.deb
          rpmroot=$HOME/rpmbuild
          mkdir -p $rpmroot/BUILDROOT/stockd/usr/lib/stockd
          cp -r "$BUNDLE"/* $rpmroot/BUILDROOT/stockd/usr/lib/stockd/
          rpmbuild -bb --define "_topdir $rpmroot" <<< "
          Name: stockd
          Version: 1.0.0
          Release: 1
          Summary: StockD
          BuildArch: x86_64
          %files
          /usr/lib/stockd
          "
          mv $rpmroot/RPMS/*/*.rpm StockD-${{ matrix.id }}-${{ github.run_number }}.rpm || true

      - name: MacOS Packaging
        if: matrix.platform == 'macos'
        shell: bash
        run: echo "Packaging for macOS..."

      - name: Windows Packaging
        if: matrix.platform == 'windows'
        shell: powershell
        run: Write-Host "Packaging for Windows..."

      - name: Split and Upload
        shell: bash
        run: |
          for f in *.exe *.dmg *.deb *.rpm 2>/dev/null; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 1990000000 ]; then split -b 1900m "$f" "$f.part_"; rm "$f"; fi
          done

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          files: |
            *.exe
            *.dmg
            *.deb
            *.rpm
            *.part_*
