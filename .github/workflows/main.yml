name: Build StockD

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:

# ─────────────────────────────────────────────────────────────
# Linux (x64 + arm64)
# ─────────────────────────────────────────────────────────────

  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'linux'

    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            bundle: build/linux/x64/release
            artifact: stockd-linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            bundle: build/linux/arm64/release
            artifact: stockd-linux-arm64

    steps:

      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libpango1.0-dev \
            libatk1.0-dev libgdk-pixbuf-2.0-dev \
            python3.12 python3.12-dev python3-pip \
            libssl-dev rpm ruby ruby-dev \
            dpkg-dev fakeroot

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter deps
        run: flutter pub get

      - name: Build Flutter Linux
        run: flutter build linux --release

      - name: Package ML backend
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install pyinstaller \
            fastapi uvicorn pydantic pandas numpy \
            scikit-learn yfinance

          cd ML
          python3.12 -m PyInstaller --onefile --name sage_server main.py
          cp dist/sage_server ../${{ matrix.bundle }}/bundle/

      - name: Create tar.gz
        run: |
          cd ${{ matrix.bundle }}
          tar -czf stockd-${{ matrix.arch }}.tar.gz bundle/

      - name: Create DEB/RPM packages
        run: |
          sudo gem install fpm

          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/lib/stockd
          mkdir -p pkg/usr/share/applications

          cp -r ${{ matrix.bundle }}/bundle/* pkg/usr/lib/stockd/

          cat > pkg/usr/bin/stockd << 'EOF'
          #!/bin/bash
          exec /usr/lib/stockd/stockd "$@"
          EOF

          chmod +x pkg/usr/bin/stockd

          cat > pkg/usr/share/applications/stockd.desktop << 'EOF'
          [Desktop Entry]
          Name=StockD
          Comment=Gamified Stock Market Literacy
          Exec=/usr/lib/stockd/stockd
          Icon=stockd
          Terminal=false
          Type=Application
          Categories=Education;Finance;
          EOF

          ARCH_DEB=${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}
          ARCH_RPM=${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}

          fpm -s dir -t deb \
            -n stockd \
            -v 1.0.0 \
            --architecture $ARCH_DEB \
            --depends libgtk-3-0 \
            --depends libglib2.0-0 \
            -C pkg \
            --package stockd-linux-${{ matrix.arch }}.deb .

          fpm -s dir -t rpm \
            -n stockd \
            -v 1.0.0 \
            --architecture $ARCH_RPM \
            --depends gtk3 \
            --depends glib2 \
            -C pkg \
            --package stockd-linux-${{ matrix.arch }}.rpm .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle }}/stockd-${{ matrix.arch }}.tar.gz
            stockd-linux-${{ matrix.arch }}.deb
            stockd-linux-${{ matrix.arch }}.rpm

# ─────────────────────────────────────────────────────────────
# macOS
# ─────────────────────────────────────────────────────────────

  build-macos:
    name: macOS
    runs-on: macos-14

    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'macos'

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package ML backend
        run: |
          brew install python@3.12
          /opt/homebrew/bin/python3.12 -m pip install \
            pyinstaller fastapi uvicorn pydantic \
            pandas numpy scikit-learn yfinance \
            --break-system-packages

          cd ML
          /opt/homebrew/bin/python3.12 -m PyInstaller \
            --onefile --name sage_server main.py

          cp dist/sage_server \
            ../build/macos/Build/Products/Release/stockd.app/Contents/MacOS/

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "StockD" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            StockD.dmg \
            build/macos/Build/Products/Release/stockd.app

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-macos
          path: StockD.dmg

# ─────────────────────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────────────────────

  build-windows:
    name: Windows
    runs-on: windows-2022

    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'windows'

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package ML backend
        run: |
          pip install pyinstaller fastapi uvicorn pydantic `
            pandas numpy scikit-learn yfinance

          cd ML
          pyinstaller --onefile --name sage_server main.py
          copy dist\sage_server.exe ..\build\windows\x64\runner\Release\

      - name: Build installer
        run: |
          choco install nsis -y

          @"
          Name "StockD"
          OutFile "stockd-windows-x64-setup.exe"
          InstallDir "$PROGRAMFILES64\StockD"

          Section
          SetOutPath "$INSTDIR"
          File /r "build\windows\x64\runner\Release\*.*"
          CreateShortcut "$DESKTOP\StockD.lnk" "$INSTDIR\stockd.exe"
          SectionEnd
          "@ | Out-File -Encoding ASCII stockd.nsi

          makensis stockd.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-windows-x64
          path: stockd-windows-x64-setup.exe

# ─────────────────────────────────────────────────────────────
# Release
# ─────────────────────────────────────────────────────────────

  release:
    name: Publish Release
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-24.04

    if: github.event_name == 'release'

    steps:

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
