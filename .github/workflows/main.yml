name: StockD Multi-Platform Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 
    inputs:
      build_windows: { description: "Build Windows (Universal)", type: boolean, default: true }
      build_macos: { description: "Build macOS (Intel & ARM)", type: boolean, default: true }
      build_linux: { description: "Build Linux (Nvidia, Intel, AMD, ARM)", type: boolean, default: true }

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MACOSX_DEPLOYMENT_TARGET: "11.0"

permissions:
  contents: write

jobs:
  setup-matrix:
    name: Configure OS Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix JSON
        id: set-matrix
        shell: python
        run: |
          import json, os
          matrix = []
          if "${{ inputs.build_windows }}" == "true":
              matrix.append({"id": "windows-x64", "os": "windows-latest", "platform": "windows", "arch": "x64", "pkgs": "tensorflow==2.10.1", "python_ver": "3.10"})
          if "${{ inputs.build_macos }}" == "true":
              matrix.append({"id": "mac-arm", "os": "macos-15", "platform": "macos", "arch": "arm64", "pkgs": "tensorflow tensorflow-metal", "python_ver": "3.12", "mac_pkg": "3.12.3"})
              matrix.append({"id": "mac-intel", "os": "macos-15-intel", "platform": "macos", "arch": "x64", "pkgs": "tensorflow", "python_ver": "3.12", "mac_pkg": "3.12.3"})
          if "${{ inputs.build_linux }}" == "true":
              matrix.append({"id": "linux-x64-nvidia", "os": "ubuntu-latest", "platform": "linux", "arch": "x64", "deb_arch": "amd64", "rpm_arch": "x86_64", "pkgs": "tensorflow[and-cuda]", "python_ver": "3.12"})
              matrix.append({"id": "linux-x64-amd", "os": "ubuntu-latest", "platform": "linux", "arch": "x64", "deb_arch": "amd64", "rpm_arch": "x86_64", "pkgs": "tensorflow", "python_ver": "3.12"})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  build:
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.matrix != '[]' }}
    name: Build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python_ver }} }
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: { channel: stable }

      - name: Compile PyInstaller
        shell: bash
        run: |
          pip install pyinstaller delocate ${{ matrix.pkgs }} "numpy<2" "protobuf<=3.20.3" scikit-learn pandas yfinance fastapi uvicorn
          cd ML
          SEP=":"
          if [ "$RUNNER_OS" == "Windows" ]; then SEP=";"; fi
          pyinstaller --name sage_backend --onedir --noconsole --clean \
            --add-data "artifacts${SEP}artifacts" \
            --collect-all ssl --collect-all certifi --collect-all pandas --collect-all pyarrow \
            --hidden-import "ssl" --hidden-import "certifi" \
            --exclude-module tensorboard --exclude-module tensorflow_estimator main.py
          
          if [ "$RUNNER_OS" == "macOS" ]; then
             delocate-listdeps dist/sage_backend/sage_backend
             delocate-wheel -w . dist/sage_backend/sage_backend
          fi
          
          mkdir -p ../backend
          cp -r dist/sage_backend/* ../backend/
          rm -rf build dist

      - name: Build Flutter GUI
        run: |
          flutter config --enable-${{ matrix.platform }}-desktop
          flutter build ${{ matrix.platform }} --release
          
      - name: Inject and Fix Permissions
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
             ASSETS="build/windows/x64/runner/Release/data/flutter_assets/backend_bundle"
             mkdir -p $ASSETS && cp -r backend/* $ASSETS/
          elif [ "${{ matrix.platform }}" == "macos" ]; then
             DEST="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
             mkdir -p $DEST && cp -r backend/* $DEST/ && chmod +x "$DEST/sage_backend"
          else
             BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
             mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
             cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
             chmod +x "$BUNDLE/data/flutter_assets/backend_bundle/sage_backend"
          fi

      - name: Package Windows (NSIS)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $nsis = @"
          Name "StockD"
          OutFile "StockD-${{ matrix.id }}-setup.exe"
          Section
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
          SectionEnd
          "@
          $nsis | Out-File StockD.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" StockD.nsi

      - name: Package macOS (DMG)
        if: matrix.platform == 'macos'
        run: |
          hdiutil create -volname "StockD-${{ matrix.id }}" -srcfolder build/macos/Build/Products/Release/StockD.app -ov -format UDRW StockD-${{ matrix.id }}.dmg

      - name: Package Linux (DEB & RPM)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y rpm
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          DEB_ROOT=build/linux/deb/StockD-1.2.0
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          echo -e "Package: stockd\nVersion: 1.2.0\nArchitecture: ${{ matrix.deb_arch }}\nMaintainer: Gautam Mahajan\nDescription: AI Stock App\nDepends: libgtk-3-0" > $DEB_ROOT/DEBIAN/control
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-${{ matrix.id }}.deb
          mkdir -p $HOME/rpmbuild/{BUILDROOT,SPECS}
          cp -r $DEB_ROOT/usr/lib/StockD-1.2.0 $HOME/rpmbuild/BUILDROOT/
          echo -e "Name: StockD\nVersion: 1.2.0\nRelease: 1\nSummary: StockD\n%files\n/usr/lib/StockD-1.2.0" > $HOME/rpmbuild/SPECS/stockd.spec
          rpmbuild -bb --define "_topdir $HOME/rpmbuild" $HOME/rpmbuild/SPECS/stockd.spec
          mv $HOME/rpmbuild/RPMS/*/*.rpm StockD-${{ matrix.id }}.rpm

      # ==========================================
      # HYBRID SPLIT LOGIC
      # ==========================================
      - name: Split Large Binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows: 7-Zip Splitting (.7z.001, .7z.002)
            find . -maxdepth 1 -type f -size +1900M -name "*.exe" | while read file; do
              echo "Compressing and splitting $file with 7-Zip..."
              7z a -v1900m "${file}.7z" "$file"
              rm "$file"
            done
          else
            # Unix (macOS/Linux): Native GNU Splitting (.part_aa, .part_ab)
            find . -maxdepth 1 -type f -size +1900M \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) | while read file; do
              echo "Splitting $file natively..."
              split -b 1900M "$file" "${file}.part_"
              rm "$file"
            done
          fi
          
      - name: Upload Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "StockD-1.2.0"
          make_latest: true
          overwrite_files: true
          files: |
            *.exe
            *.dmg
            *.deb
            *.rpm
            *.part_*
            *.7z.*
