name: Build StockD

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

  push:
    branches: [main]

  pull_request:
    branches: [main]

  release:
    types: [created]

jobs:

# ─────────────────────────────────────────
# Linux x64
# ─────────────────────────────────────────

  build-linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'linux'

    steps:

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libpango1.0-dev \
            libatk1.0-dev libgdk-pixbuf-2.0-dev \
            python3.12 python3.12-dev python3-pip \
            libssl-dev rpm ruby ruby-dev \
            dpkg-dev fakeroot

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Build ML backend
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install \
            pyinstaller fastapi uvicorn pydantic \
            pandas numpy scikit-learn yfinance

          cd ML
          python3.12 -m PyInstaller --onefile --name sage_server main.py
          cp dist/sage_server ../build/linux/x64/release/bundle/

      - name: Create tarball
        run: |
          cd build/linux/x64/release
          tar -czf stockd-linux-x64.tar.gz bundle/

      - name: Create DEB + RPM
        run: |
          sudo gem install fpm

          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/lib/stockd
          mkdir -p pkg/usr/share/applications

          cp -r build/linux/x64/release/bundle/* pkg/usr/lib/stockd/

          cat > pkg/usr/bin/stockd << 'EOF'
          #!/bin/bash
          exec /usr/lib/stockd/stockd "$@"
          EOF

          chmod +x pkg/usr/bin/stockd

          cat > pkg/usr/share/applications/stockd.desktop << 'EOF'
          [Desktop Entry]
          Name=StockD
          Comment=Gamified Stock Market Literacy
          Exec=/usr/lib/stockd/stockd
          Icon=stockd
          Terminal=false
          Type=Application
          Categories=Education;Finance;
          EOF

          fpm -s dir -t deb \
            -n stockd \
            -v 1.0.0 \
            --architecture amd64 \
            --depends libgtk-3-0 \
            --depends libglib2.0-0 \
            -C pkg \
            --package stockd-linux-x64.deb .

          fpm -s dir -t rpm \
            -n stockd \
            -v 1.0.0 \
            --architecture x86_64 \
            --depends gtk3 \
            --depends glib2 \
            -C pkg \
            --package stockd-linux-x64.rpm .

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-linux-x64
          path: |
            build/linux/x64/release/stockd-linux-x64.tar.gz
            stockd-linux-x64.deb
            stockd-linux-x64.rpm


# ─────────────────────────────────────────
# macOS Universal
# ─────────────────────────────────────────

  build-macos:
    name: macOS Universal
    runs-on: macos-14

    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'macos'

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package ML backend
        run: |
          brew install python@3.12

          /opt/homebrew/bin/python3.12 -m pip install \
            pyinstaller fastapi uvicorn pydantic \
            pandas numpy scikit-learn yfinance \
            --break-system-packages

          cd ML
          /opt/homebrew/bin/python3.12 -m PyInstaller \
            --onefile --name sage_server main.py

          cp dist/sage_server \
            ../build/macos/Build/Products/Release/stockd.app/Contents/MacOS/

      - name: Create DMG
        run: |
          brew install create-dmg

          create-dmg \
            --volname "StockD" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            StockD.dmg \
            build/macos/Build/Products/Release/stockd.app

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-macos
          path: StockD.dmg


# ─────────────────────────────────────────
# Windows x64
# ─────────────────────────────────────────

  build-windows:
    name: Windows x64
    runs-on: windows-2022

    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'windows'

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ML backend
        run: |
          pip install pyinstaller fastapi uvicorn pydantic `
            pandas numpy scikit-learn yfinance

          cd ML
          pyinstaller --onefile --name sage_server main.py
          copy dist\sage_server.exe ..\build\windows\x64\runner\Release\

      - name: Build installer
        run: |
          choco install nsis -y

          @"
          Name "StockD"
          OutFile "stockd-windows-x64-setup.exe"
          InstallDir "$PROGRAMFILES64\StockD"

          Section
            SetOutPath "$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            CreateShortcut "$DESKTOP\StockD.lnk" "$INSTDIR\stockd.exe"
          SectionEnd
          "@ | Out-File -Encoding ASCII stockd.nsi

          makensis stockd.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-windows-x64
          path: stockd-windows-x64-setup.exe


# ─────────────────────────────────────────
# Release Upload
# ─────────────────────────────────────────

  release:
    name: Publish Release
    needs:
      - build-linux
      - build-macos
      - build-windows

    runs-on: ubuntu-24.04
    if: github.event_name == 'release'

    steps:

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
