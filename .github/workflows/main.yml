name: Build StockD

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform"
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - macos

jobs:
  build-backend:
    name: Build SAGE Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install & Compile
        run: |
          python -m pip install pyinstaller tensorflow scikit-learn pandas yfinance
          cd ML
          python -m PyInstaller --name sage_backend --onedir --noconsole --clean --strip --add-data "artifacts:artifacts" main.py
      - name: Upload Backend
        uses: actions/upload-artifact@v4
        with:
          name: sage-backend-bundle
          path: ML/dist/sage_backend/

  package-linux:
    needs: build-backend
    runs-on: ubuntu-latest
    if: inputs.target == 'linux'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm
      - uses: actions/download-artifact@v4
        with:
          name: sage-backend-bundle
          path: backend
      - name: Build Linux
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          
          # DEB Packaging
          DEB_ROOT=build/linux/deb/StockD-1.2.0
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications
          tar -C $BUNDLE -cf - . | tar -xf - -C $DEB_ROOT/usr/lib/StockD-1.2.0/
          
          cat > $DEB_ROOT/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Type=Application
          Categories=Finance;Education;
          EOF
          
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          chmod 755 $DEB_ROOT/usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/lib/StockD-1.2.0/data/flutter_assets/backend_bundle/sage_backend
          
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd
          Version: 1.2.0
          Architecture: amd64
          Maintainer: Gautam Mahajan
          Description: AI Stock App
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group -Znone --build $DEB_ROOT StockD-linux-x64.deb
          
          # RPM Packaging
          RPM_ROOT=$HOME/rpmbuild
          mkdir -p $RPM_ROOT/{SPECS,SOURCES,BUILD,BUILDROOT,RPMS}
          tar -czf $RPM_ROOT/SOURCES/StockD-1.2.0.tar.gz -C $BUNDLE .
          
          python3 - << 'PYEOF'
          import os
          spec = """Name: StockD
          Version: 1.2.0
          Release: 1
          Summary: StockD App
          BuildArch: x86_64
          License: Proprietary
          Source0: StockD-1.2.0.tar.gz
          %description
          AI Coach.
          %prep
          %setup -c -n StockD-1.2.0
          %install
          mkdir -p %{buildroot}/usr/lib/StockD-1.2.0 %{buildroot}/usr/bin %{buildroot}/usr/share/applications
          cp -r ./* %{buildroot}/usr/lib/StockD-1.2.0/
          chmod 755 %{buildroot}/usr/lib/StockD-1.2.0/stockd %{buildroot}/usr/lib/StockD-1.2.0/data/flutter_assets/backend_bundle/sage_backend
          ln -s /usr/lib/StockD-1.2.0/stockd %{buildroot}/usr/bin/stockd
          printf '[Desktop Entry]\\nName=StockD\\nExec=/usr/bin/stockd\\nType=Application\\nCategories=Finance;\\n' > %{buildroot}/usr/share/applications/stockd.desktop
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          """
          with open(os.path.expanduser("~/rpmbuild/SPECS/StockD.spec"), "w") as f:
              f.write(spec)
          PYEOF
          rpmbuild -bb --define "__strip /bin/true" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/x86_64/StockD-1.2.0-1.x86_64.rpm StockD-linux-x64.rpm
      - uses: actions/upload-artifact@v4
        with: 
          name: StockD-linux-pkgs
          path: |
            StockD-linux-x64.deb
            StockD-linux-x64.rpm

  package-macos:
    needs: build-backend
    strategy:
      matrix:
        include:
          - {runner: macos-15-intel, name: intel}
          - {runner: macos-15, name: arm}
    runs-on: ${{ matrix.runner }}
    if: inputs.target == 'macos'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/download-artifact@v4
        with:
          name: sage-backend-bundle
          path: backend
      - run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          find build/macos/Build/Products/Release/StockD.app -name "*.dSYM" -exec rm -rf {} +
          DEST_DIR="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
          mkdir -p "$DEST_DIR"
          cp -r backend/* "$DEST_DIR/"
          rm -f StockD-macos-${{ matrix.name }}.dmg
          sleep 2
          hdiutil create -volname "StockD-${{ matrix.name }}" -srcfolder build/macos/Build/Products/Release/StockD.app -ov -format UDRW StockD-macos-${{ matrix.name }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: StockD-macos-${{ matrix.name }}
          path: StockD-macos-${{ matrix.name }}.dmg

  package-windows:
    needs: build-backend
    runs-on: windows-latest
    if: inputs.target == 'windows'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/download-artifact@v4
        with:
          name: sage-backend-bundle
          path: backend
      - name: Build and Copy
        shell: powershell
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          $bundlePath = "build\windows\x64\runner\Release"
          $assetsPath = "$bundlePath\data\flutter_assets\backend_bundle"
          New-Item -ItemType Directory -Force -Path $assetsPath
          Copy-Item -Path "backend\*" -Destination $assetsPath -Recurse
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Installer
        shell: powershell
        run: |
          @"
          Name "StockD"
          OutFile "StockD-windows-x64-setup.exe"
          InstallDir "$PROGRAMFILES64\StockD"
          Section
            SetOutPath "$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            CreateShortcut "$DESKTOP\StockD.lnk" "$INSTDIR\StockD.exe"
          SectionEnd
          "@ | Out-File -Encoding ASCII StockD.nsi
          makensis.exe StockD.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: StockD-windows-x64
          path: StockD-windows-x64-setup.exe
