name: Build StockD

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm64
          - macos
          - windows-x64
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'linux-x64'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libpango1.0-dev \
            libatk1.0-dev libgdk-pixbuf-2.0-dev \
            python3.12 python3.12-dev python3.12-distutils \
            libssl-dev rpm ruby ruby-dev \
            dpkg-dev fakeroot

      - name: Install pip for Python 3.12
        run: curl https://bootstrap.pypa.io/get-pip.py | python3.12

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package ML backend
        run: |
          python3.12 -m pip install pyinstaller
          cd ML
          python3.12 -m pip install fastapi uvicorn pydantic pandas numpy \
            scikit-learn yfinance
          python3.12 -m PyInstaller --onefile --name sage_server main.py
          cp dist/sage_server ../build/linux/x64/release/bundle/

      - name: Create .tar.gz
        run: |
          cd build/linux/x64/release
          tar -czf stockd-linux-x64.tar.gz bundle/

      - name: Create .deb and .rpm
        run: |
          sudo gem install fpm

          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/lib/stockd
          mkdir -p pkg/usr/share/applications

          cp -r build/linux/x64/release/bundle/* pkg/usr/lib/stockd/

          cat > pkg/usr/bin/stockd << 'SCRIPT'
          #!/bin/bash
          exec /usr/lib/stockd/stockd "$@"
          SCRIPT
          chmod +x pkg/usr/bin/stockd

          cat > pkg/usr/share/applications/stockd.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=StockD
          Comment=Gamified Stock Market Literacy
          Exec=/usr/lib/stockd/stockd
          Icon=stockd
          Terminal=false
          Type=Application
          Categories=Education;Finance;
          DESKTOP

          fpm -s dir -t deb \
            -n stockd \
            -v 1.0.0 \
            --architecture amd64 \
            --description "StockD — Gamified Stock Market Literacy" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "StockD Team" \
            --depends "libgtk-3-0" \
            --depends "libglib2.0-0" \
            --depends "python3.12" \
            -C pkg \
            --package stockd-linux-x64.deb \
            .

          fpm -s dir -t rpm \
            -n stockd \
            -v 1.0.0 \
            --architecture x86_64 \
            --description "StockD — Gamified Stock Market Literacy" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "StockD Team" \
            --depends "gtk3" \
            --depends "glib2" \
            -C pkg \
            --package stockd-linux-x64.rpm \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-linux-x64
          path: |
            build/linux/x64/release/stockd-linux-x64.tar.gz
            stockd-linux-x64.deb
            stockd-linux-x64.rpm

  # ── Linux ARM64 ──────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-22.04-arm
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'linux-arm64'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev libpango1.0-dev \
            libatk1.0-dev libgdk-pixbuf-2.0-dev \
            python3.12 python3.12-dev python3.12-distutils \
            libssl-dev rpm ruby ruby-dev \
            dpkg-dev fakeroot

      - name: Install pip for Python 3.12
        run: curl https://bootstrap.pypa.io/get-pip.py | python3.12

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux ARM64
        run: flutter build linux --release

      - name: Package ML backend
        run: |
          python3.12 -m pip install pyinstaller
          cd ML
          python3.12 -m pip install fastapi uvicorn pydantic pandas numpy \
            scikit-learn yfinance
          python3.12 -m PyInstaller --onefile --name sage_server main.py
          cp dist/sage_server ../build/linux/arm64/release/bundle/

      - name: Create .tar.gz
        run: |
          cd build/linux/arm64/release
          tar -czf stockd-linux-arm64.tar.gz bundle/

      - name: Create .deb and .rpm
        run: |
          sudo gem install fpm

          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/lib/stockd
          mkdir -p pkg/usr/share/applications

          cp -r build/linux/arm64/release/bundle/* pkg/usr/lib/stockd/

          cat > pkg/usr/bin/stockd << 'SCRIPT'
          #!/bin/bash
          exec /usr/lib/stockd/stockd "$@"
          SCRIPT
          chmod +x pkg/usr/bin/stockd

          cat > pkg/usr/share/applications/stockd.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=StockD
          Comment=Gamified Stock Market Literacy
          Exec=/usr/lib/stockd/stockd
          Icon=stockd
          Terminal=false
          Type=Application
          Categories=Education;Finance;
          DESKTOP

          fpm -s dir -t deb \
            -n stockd \
            -v 1.0.0 \
            --architecture arm64 \
            --description "StockD — Gamified Stock Market Literacy" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "StockD Team" \
            --depends "libgtk-3-0" \
            --depends "libglib2.0-0" \
            --depends "python3.12" \
            -C pkg \
            --package stockd-linux-arm64.deb \
            .

          fpm -s dir -t rpm \
            -n stockd \
            -v 1.0.0 \
            --architecture aarch64 \
            --description "StockD — Gamified Stock Market Literacy" \
            --url "https://github.com/${{ github.repository }}" \
            --maintainer "StockD Team" \
            --depends "gtk3" \
            --depends "glib2" \
            -C pkg \
            --package stockd-linux-arm64.rpm \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-linux-arm64
          path: |
            build/linux/arm64/release/stockd-linux-arm64.tar.gz
            stockd-linux-arm64.deb
            stockd-linux-arm64.rpm

  # ── macOS Universal ──────────────────────────────────────────────────────────
  build-macos:
    name: macOS Universal
    runs-on: macos-14
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'macos'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Install Python deps + package ML backend
        run: |
          brew install python@3.12
          /opt/homebrew/bin/python3.12 -m pip install \
            pyinstaller fastapi uvicorn pydantic pandas numpy \
            scikit-learn yfinance --break-system-packages
          cd ML
          /opt/homebrew/bin/python3.12 -m PyInstaller \
            --onefile --name sage_server main.py
          cp dist/sage_server \
            "../build/macos/Build/Products/Release/stockd.app/Contents/MacOS/"

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "StockD" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            "StockD.dmg" \
            "build/macos/Build/Products/Release/stockd.app"

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-macos
          path: StockD.dmg

  # ── Windows x86_64 ───────────────────────────────────────────────────────────
  build-windows-x64:
    name: Windows x86_64
    runs-on: windows-2022
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'windows-x64'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package ML backend
        run: |
          pip install pyinstaller fastapi uvicorn pydantic `
            pandas numpy scikit-learn yfinance
          cd ML
          pyinstaller --onefile --name sage_server main.py
          copy dist\sage_server.exe ..\build\windows\x64\runner\Release\

      - name: Create NSIS installer
        run: |
          @"
          !include "MUI2.nsh"
          Name "StockD"
          OutFile "stockd-windows-x64-setup.exe"
          InstallDir "`$PROGRAMFILES64\StockD"
          RequestExecutionLevel admin

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            CreateShortcut "`$DESKTOP\StockD.lnk" "`$INSTDIR\stockd.exe"
            CreateShortcut "`$SMPROGRAMS\StockD\StockD.lnk" "`$INSTDIR\stockd.exe"
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StockD" "DisplayName" "StockD"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StockD" "UninstallString" "`$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            RMDir /r "`$INSTDIR"
            Delete "`$DESKTOP\StockD.lnk"
            Delete "`$SMPROGRAMS\StockD\StockD.lnk"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\StockD"
          SectionEnd
          "@ | Out-File -Encoding ASCII stockd.nsi

          choco install nsis -y
          makensis stockd.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-windows-x64
          path: stockd-windows-x64-setup.exe

  # ── Release — attach all artifacts ───────────────────────────────────────────
  release:
    name: Publish Release
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-macos
      - build-windows-x64
    runs-on: ubuntu-22.04
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/stockd-linux-x64/stockd-linux-x64.tar.gz
            artifacts/stockd-linux-x64/stockd-linux-x64.deb
            artifacts/stockd-linux-x64/stockd-linux-x64.rpm
            artifacts/stockd-linux-arm64/stockd-linux-arm64.tar.gz
            artifacts/stockd-linux-arm64/stockd-linux-arm64.deb
            artifacts/stockd-linux-arm64/stockd-linux-arm64.rpm
            artifacts/stockd-macos/StockD.dmg
            artifacts/stockd-windows-x64/stockd-windows-x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
