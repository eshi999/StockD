name: StockD Multi-Platform Build Pipeline

on:
  workflow_dispatch:
    inputs:
      build_windows:
        type: boolean
        default: true
      build_macos:
        type: boolean
        default: true
      build_linux:
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: 1

# ==========================================
# MATRIX BUILDER (FIXED)
# ==========================================
jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: python
        run: |
          import json
          import os

          # Ensure inputs are boolean
          win = "${{ inputs.build_windows }}" == "true"
          mac = "${{ inputs.build_macos }}" == "true"
          lin = "${{ inputs.build_linux }}" == "true"

          matrix = []

          # SELF-HOSTED WINDOWS
          if win:
              matrix.append({
                  "id": "windows-x64",
                  "os": "self-hosted",
                  "platform": "windows",
                  "arch": "x64",
                  "jobs": 14
              })

          # MACOS (GITHUB HOSTED)
          if mac:
              matrix.append({
                  "id": "mac-arm64",
                  "os": "macos-15",
                  "platform": "macos",
                  "arch": "arm64",
                  "jobs": 4
              })
              matrix.append({
                  "id": "mac-intel",
                  "os": "macos-15",
                  "platform": "macos",
                  "arch": "x64",
                  "jobs": 4
              })

          # SELF-HOSTED LINUX X64
          if lin:
              matrix.append({
                  "id": "linux-x64",
                  "os": "self-hosted",
                  "platform": "linux",
                  "arch": "x64",
                  "jobs": 14
              })

              # OPTIONAL CLOUD ARM64
              matrix.append({
                  "id": "linux-arm64",
                  "os": "ubuntu-24.04-arm",
                  "platform": "linux",
                  "arch": "arm64",
                  "jobs": 4
              })

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}")

# ==========================================
# BUILD JOB
# ==========================================
  build:
    needs: setup-matrix
    if: ${{ fromJSON(needs.setup-matrix.outputs.matrix)[0] != null }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

# ==========================================
# PYTHON + FLUTTER
# ==========================================
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

# ==========================================
# NUITKA BUILD
# ==========================================
      - name: Build backend (Nuitka)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard ordered-set
          pip install tensorflow==2.19.1 fastapi uvicorn pandas scikit-learn yfinance

          cd ML

          python -m nuitka main.py \
            --standalone \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --jobs=${{ matrix.jobs }} \
            --plugin-enable=anti-bloat \
            --nofollow-import-to=tensorboard \
            --nofollow-import-to=tensorflow_estimator \
            --nofollow-import-to=tensorflow.compiler \
            --nofollow-import-to=tensorflow.lite

          mkdir -p ../backend
          cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend || true
          mv ../backend/main.exe ../backend/sage_backend.exe || true

# ==========================================
# FLUTTER BUILD
# ==========================================
      - name: Flutter build
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            flutter build windows --release
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            flutter build macos --release
          else
            flutter build linux --release
          fi

# ==========================================
# BACKEND INJECTION
# ==========================================
      - name: Inject backend
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            DEST="build/windows/x64/runner/Release/data/flutter_assets/backend_bundle"
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            DEST="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
          else
            DEST="build/linux/x64/release/bundle/data/flutter_assets/backend_bundle"
          fi

          mkdir -p "$DEST"
          cp -r backend/* "$DEST"

# ==========================================
# LINUX PACKAGING
# ==========================================
      - name: Linux packaging
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          mkdir -p package/usr/share/applications
          cat > package/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=stockd
          Icon=stockd
          Type=Application
          Categories=Finance;
          EOF

          mkdir -p deb/usr/lib/stockd deb/usr/bin
          cp -r "$BUNDLE"/* deb/usr/lib/stockd/
          ln -s /usr/lib/stockd/stockd deb/usr/bin/stockd || true

          cat > deb/DEBIAN/control << EOF
          Package: stockd
          Version: 1.0.0
          Architecture: amd64
          Maintainer: StockD
          Description: StockD AI App
          EOF

          dpkg-deb --build deb StockD-${{ matrix.id }}-${{ github.run_number }}.deb

          rpmroot=$HOME/rpmbuild
          mkdir -p $rpmroot/BUILDROOT/stockd/usr/lib/stockd
          cp -r "$BUNDLE"/* $rpmroot/BUILDROOT/stockd/usr/lib/stockd/
          rpmbuild -bb --define "_topdir $rpmroot" <<< "
          Name: stockd
          Version: 1.0.0
          Release: 1
          Summary: StockD
          BuildArch: x86_64
          %files
          /usr/lib/stockd
          "
          mv $rpmroot/RPMS/*/*.rpm StockD-${{ matrix.id }}-${{ github.run_number }}.rpm || true

# ==========================================
# SPLIT + UPLOAD
# ==========================================
      - name: Split large artifacts
        shell: bash
        run: |
          for f in *.exe *.dmg *.deb *.rpm 2>/dev/null; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 1990000000 ]; then
              split -b 1900m "$f" "$f.part_"
              rm "$f"
            fi
          done

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          files: |
            *.exe
            *.dmg
            *.deb
            *.rpm
            *.part_*
