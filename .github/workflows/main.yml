name: Build StockD

on:
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────
  # Linux x64 — .deb + .rpm
  # ─────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Verify Flutter
        run: |
          if ! command -v flutter &> /dev/null; then
            echo "Flutter not found on PATH"
            exit 1
          fi
          flutter --version

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons

      - name: Build Flutter Linux app
        run: flutter build linux --release

      - name: Prepare bundle
        run: |
          RELEASE_DIR=build/linux/x64/release/bundle
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Release directory not found: $RELEASE_DIR"
            exit 1
          fi
          mkdir -p build/linux/x64/bundle
          cp -r $RELEASE_DIR/* build/linux/x64/bundle/
          echo "Linux bundle prepared"

      - name: Build .deb package
        run: |
          BUNDLE_DIR=build/linux/x64/bundle
          DEB_ROOT=build/linux/deb/stockd

          mkdir -p $DEB_ROOT/DEBIAN
          mkdir -p $DEB_ROOT/usr/bin
          mkdir -p $DEB_ROOT/usr/lib/stockd
          mkdir -p $DEB_ROOT/usr/share/applications
          mkdir -p $DEB_ROOT/usr/share/icons/hicolor/256x256/apps

          cp -r $BUNDLE_DIR/* $DEB_ROOT/usr/lib/stockd/

          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd
          Version: 1.0.0
          Architecture: amd64
          Maintainer: StockD <noreply@stockd.app>
          Description: Gamified stock market literacy app
          Depends: libgtk-3-0, libblkid1, liblzma5
          EOF

          cat > $DEB_ROOT/usr/bin/stockd << EOF
          #!/bin/bash
          exec /usr/lib/stockd/stockd "\$@"
          EOF
          chmod +x $DEB_ROOT/usr/bin/stockd

          cat > $DEB_ROOT/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Education;Finance;
          EOF

          ICON_SRC=$BUNDLE_DIR/data/flutter_assets/assets/images/StockD.png
          if [ -f "$ICON_SRC" ]; then
            cp $ICON_SRC $DEB_ROOT/usr/share/icons/hicolor/256x256/apps/stockd.png
          fi

          dpkg-deb --root-owner-group --build $DEB_ROOT stockd-linux-x64.deb
          echo "Built stockd-linux-x64.deb"

      - name: Build .rpm package
        run: |
          BUNDLE_DIR=build/linux/x64/bundle
          RPM_ROOT=$HOME/rpmbuild

          mkdir -p $RPM_ROOT/{SPECS,SOURCES,BUILD,BUILDROOT,RPMS,SRPMS}
          mkdir -p $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/lib/stockd
          mkdir -p $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/bin
          mkdir -p $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/share/applications
          mkdir -p $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/share/icons/hicolor/256x256/apps

          cp -r $BUNDLE_DIR/* $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/lib/stockd/

          cat > $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/bin/stockd << EOF
          #!/bin/bash
          exec /usr/lib/stockd/stockd "\$@"
          EOF
          chmod +x $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/bin/stockd

          cat > $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Education;Finance;
          EOF

          ICON_SRC=$BUNDLE_DIR/data/flutter_assets/assets/images/StockD.png
          if [ -f "$ICON_SRC" ]; then
            cp $ICON_SRC $RPM_ROOT/BUILDROOT/stockd-1.0.0-1.x86_64/usr/share/icons/hicolor/256x256/apps/stockd.png
          fi

          cat > $RPM_ROOT/SPECS/stockd.spec << EOF
          %define _dbpath $HOME/.rpmdb
          Name:           stockd
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        Gamified stock market literacy app
          License:        Proprietary
          BuildArch:      x86_64

          %description
          StockD is a gamified stock market literacy app powered by an AI coach.

          %install
          # files already staged in BUILDROOT

          %files
          /usr/bin/stockd
          /usr/lib/stockd/
          /usr/share/applications/stockd.desktop
          /usr/share/icons/hicolor/256x256/apps/stockd.png

          %pre
          mkdir -p /usr/lib/stockd
          EOF

          rpmbuild -bb \
            --define "_dbpath $HOME/.rpmdb" \
            --define "_topdir $RPM_ROOT" \
            $RPM_ROOT/SPECS/stockd.spec

          find $RPM_ROOT/RPMS -name "*.rpm" -exec cp {} stockd-linux-x64.rpm \;
          echo "Built stockd-linux-x64.rpm"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockd-linux-deb
          path: stockd-linux-x64.deb

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockd-linux-rpm
          path: stockd-linux-x64.rpm
