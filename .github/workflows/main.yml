name: Build StockD

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos

jobs:

  # ─────────────────────────────────────────
  # Linux x64 — .deb + .rpm
  # ─────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    if: inputs.target == 'all' || inputs.target == 'linux'

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            ninja-build \
            libglib2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            rpm

      - name: Generate icons
        run: dart run flutter_launcher_icons

      - name: Build Flutter Linux app
        run: flutter build linux --release

      - name: Prepare bundle
        run: |
          RELEASE_DIR=build/linux/x64/release/bundle
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Release directory not found: $RELEASE_DIR"
            exit 1
          fi
          mkdir -p build/linux/x64/bundle
          cp -r $RELEASE_DIR/* build/linux/x64/bundle/
          echo "Linux bundle prepared"

      - name: Build .deb package
        run: |
          BUNDLE_DIR=build/linux/x64/bundle
          DEB_ROOT=build/linux/deb/stockd

          mkdir -p $DEB_ROOT/DEBIAN
          mkdir -p $DEB_ROOT/usr/bin
          mkdir -p $DEB_ROOT/usr/lib/stockd
          mkdir -p $DEB_ROOT/usr/share/applications
          mkdir -p $DEB_ROOT/usr/share/icons/hicolor/256x256/apps

          cp -r $BUNDLE_DIR/* $DEB_ROOT/usr/lib/stockd/

          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd
          Version: 1.0.0
          Architecture: amd64
          Maintainer: StockD <noreply@stockd.app>
          Description: Gamified stock market literacy app
          Depends: libgtk-3-0, libblkid1, liblzma5
          EOF

          cat > $DEB_ROOT/usr/bin/stockd << EOF
          #!/bin/bash
          exec /usr/lib/stockd/stockd "\$@"
          EOF
          chmod +x $DEB_ROOT/usr/bin/stockd

          cat > $DEB_ROOT/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Education;Finance;
          EOF

          ICON_SRC=$BUNDLE_DIR/data/flutter_assets/assets/images/stockd.png
          if [ -f "$ICON_SRC" ]; then
            cp $ICON_SRC $DEB_ROOT/usr/share/icons/hicolor/256x256/apps/stockd.png
          fi

          dpkg-deb --build $DEB_ROOT stockd-linux-x64.deb
          echo "Built stockd-linux-x64.deb"

      - name: Build .rpm package
        run: |
          BUNDLE_DIR=build/linux/x64/bundle
          RPM_ROOT=$HOME/rpmbuild

          mkdir -p $RPM_ROOT/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
          mkdir -p $RPM_ROOT/BUILD/stockd-1.0.0/usr/lib/stockd
          mkdir -p $RPM_ROOT/BUILD/stockd-1.0.0/usr/bin
          mkdir -p $RPM_ROOT/BUILD/stockd-1.0.0/usr/share/applications
          mkdir -p $RPM_ROOT/BUILD/stockd-1.0.0/usr/share/icons/hicolor/256x256/apps

          cp -r $BUNDLE_DIR/* $RPM_ROOT/BUILD/stockd-1.0.0/usr/lib/stockd/

          cat > $RPM_ROOT/BUILD/stockd-1.0.0/usr/bin/stockd << EOF
          #!/bin/bash
          exec /usr/lib/stockd/stockd "\$@"
          EOF
          chmod +x $RPM_ROOT/BUILD/stockd-1.0.0/usr/bin/stockd

          cat > $RPM_ROOT/BUILD/stockd-1.0.0/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Education;Finance;
          EOF

          ICON_SRC=$BUNDLE_DIR/data/flutter_assets/assets/images/stockd.png
          if [ -f "$ICON_SRC" ]; then
            cp $ICON_SRC $RPM_ROOT/BUILD/stockd-1.0.0/usr/share/icons/hicolor/256x256/apps/stockd.png
          fi

          cat > $RPM_ROOT/SPECS/stockd.spec << EOF
          Name:           stockd
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        Gamified stock market literacy app
          License:        Proprietary
          BuildArch:      x86_64

          %description
          StockD is a gamified stock market literacy app powered by an AI coach.

          %install
          cp -r %{_builddir}/stockd-1.0.0/* %{buildroot}/

          %files
          /usr/bin/stockd
          /usr/lib/stockd/
          /usr/share/applications/stockd.desktop
          /usr/share/icons/hicolor/256x256/apps/stockd.png

          %pre
          mkdir -p /usr/lib/stockd
          EOF

          rpmbuild -bb $RPM_ROOT/SPECS/stockd.spec
          find $RPM_ROOT/RPMS -name "*.rpm" -exec cp {} stockd-linux-x64.rpm \;
          echo "Built stockd-linux-x64.rpm"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockd-linux-deb
          path: stockd-linux-x64.deb

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockd-linux-rpm
          path: stockd-linux-x64.rpm

  # ─────────────────────────────────────────
  # macOS universal (x64 + arm64) — .dmg
  # ─────────────────────────────────────────
  build-macos:
    name: macOS Universal
    runs-on: macos-15
    if: inputs.target == 'all' || inputs.target == 'macos'

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons

      - name: Build Flutter macOS x64 (Intel)
        run: flutter build macos --release --darwin-arch=x86_64


      - name: Copy x64 build
        run: |
          RELEASE_DIR=build/macos/Build/Products/Release/StockD.app
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "x64 release not found: $RELEASE_DIR"
            exit 1
          fi
          cp -R $RELEASE_DIR build/macos/StockD-x64.app

      - name: Build Flutter macOS arm64 (Apple Silicon)
        run: flutter build macos --release --darwin-arm64

      - name: Copy arm64 build
        run: |
          RELEASE_DIR=build/macos/Build/Products/Release/StockD.app
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "arm64 release not found: $RELEASE_DIR"
            exit 1
          fi
          cp -R $RELEASE_DIR build/macos/StockD-arm64.app

      - name: Create universal binary with lipo
        run: |
          # Start from the arm64 app as the base
          cp -R build/macos/StockD-arm64.app build/macos/StockD-universal.app

          # Merge the two binaries into a universal binary
          lipo -create \
            build/macos/StockD-x64.app/Contents/MacOS/StockD \
            build/macos/StockD-arm64.app/Contents/MacOS/StockD \
            -output build/macos/StockD-universal.app/Contents/MacOS/StockD

          # Verify the result
          lipo -info build/macos/StockD-universal.app/Contents/MacOS/StockD
          echo "Universal binary created"

      - name: Build .dmg
        run: |
          mkdir -p build/macos/dmg_staging
          cp -R build/macos/StockD-universal.app build/macos/dmg_staging/StockD.app
          ln -s /Applications build/macos/dmg_staging/Applications

          hdiutil create \
            -volname "StockD" \
            -srcfolder build/macos/dmg_staging \
            -ov \
            -format UDZO \
            stockd-macos-universal.dmg

          echo "Built stockd-macos-universal.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockd-macos-universal
          path: stockd-macos-universal.dmg

  # ─────────────────────────────────────────
  # Windows x64 — NSIS installer
  # ─────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    if: inputs.target == 'all' || inputs.target == 'windows'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Generate icons
        shell: powershell
        run: dart run flutter_launcher_icons

      - name: Build Flutter Windows app
        run: flutter build windows --release

      - name: Copy Flutter Windows build
        shell: powershell
        run: |
          $bundlePath = "build\windows\x64\bundle"
          New-Item -ItemType Directory -Force -Path $bundlePath

          $releaseDir = "build\windows\x64\runner\Release"
          if (-Not (Test-Path $releaseDir)) {
              Write-Error "Release directory not found: $releaseDir"
              exit 1
          }

          Copy-Item -Path "$releaseDir\*" -Destination $bundlePath -Recurse -Force
          Write-Host "Windows bundle prepared at $bundlePath"

      - name: Build NSIS installer
        shell: powershell
        run: |
          choco upgrade nsis -y

          $iconSrc = "windows\runner\resources\app_icon.ico"
          $iconDst = "build\windows\x64\bundle\app_icon.ico"
          if (-Not (Test-Path $iconSrc)) {
              Write-Error "App icon not found: $iconSrc"
              exit 1
          }
          Copy-Item $iconSrc $iconDst -Force

          @'
          Name "StockD"
          OutFile "stockd-windows-x64-setup.exe"
          InstallDir "$PROGRAMFILES64\StockD"

          Icon "build\windows\x64\bundle\app_icon.ico"

          Section
            SetOutPath "$INSTDIR"
            File /r "build\windows\x64\bundle\*.*"
            CreateShortcut "$DESKTOP\StockD.lnk" "$INSTDIR\stockd.exe" "" "$INSTDIR\app_icon.ico" 0
          SectionEnd
          '@ | Out-File -Encoding ASCII stockd.nsi

          makensis stockd.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: stockd-windows-x64
          path: stockd-windows-x64-setup.exe
