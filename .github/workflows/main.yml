name: Build StockD (Ultimate Pipeline)

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Compile the Hardware-Optimized Python Backends
  # ──────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build SAGE Backend (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Targets (Modern TF + CUDA + Python 3.12)
          - { id: linux-x64-nvidia, os: ubuntu-latest, py: "3.12", pkgs: "tensorflow[and-cuda]" }
          - { id: linux-x64-intel, os: ubuntu-latest, py: "3.12", pkgs: "tensorflow intel-extension-for-tensorflow" }
          - { id: linux-x64-amd, os: ubuntu-latest, py: "3.12", pkgs: "tensorflow" }
          - { id: linux-arm64, os: ubuntu-24.04-arm, py: "3.12", pkgs: "tensorflow" }
          
          # macOS Targets (Modern TF + Metal + Python 3.12)
          - { id: mac-intel, os: macos-15-intel, py: "3.12", pkgs: "tensorflow" }
          - { id: mac-arm, os: macos-15, py: "3.12", pkgs: "tensorflow tensorflow-metal" }
          
          # Windows Targets (Pinned to TF 2.10.1 + Python 3.10 for Native GPU support)
          - { id: windows-x64-nvidia, os: windows-latest, py: "3.10", pkgs: "tensorflow==2.10.1" }
          - { id: windows-x64-intel, os: windows-latest, py: "3.10", pkgs: "tensorflow==2.10.1 intel-extension-for-tensorflow" }
          - { id: windows-x64-amd, os: windows-latest, py: "3.10", pkgs: "tensorflow==2.10.1" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: 'pip'
          
      - name: Compile PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m pip install pyinstaller ${{ matrix.pkgs }} scikit-learn pandas yfinance
          cd ML
          python -m PyInstaller --name sage_backend --onedir --noconsole --clean --strip \
            --add-data "artifacts:artifacts" \
            --exclude-module tensorboard --exclude-module tensorflow_estimator \
            main.py
            
      - name: Compile PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install pyinstaller ${{ matrix.pkgs }} scikit-learn pandas yfinance
          cd ML
          python -m PyInstaller --name sage_backend --onedir --noconsole --clean --strip `
            --add-data "artifacts;artifacts" `
            --exclude-module tensorboard --exclude-module tensorflow_estimator `
            main.py
            
      - name: Upload Compiled Backend
        uses: actions/upload-artifact@v4
        with:
          name: sage-backend-${{ matrix.id }}
          path: ML/dist/sage_backend/

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Build GUI, Inject Backend, and Package Installers
  # ──────────────────────────────────────────────────────────────────────────
  package-app:
    name: Package App (${{ matrix.id }})
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { id: linux-x64-nvidia, os: ubuntu-latest, platform: linux, arch: x64, deb_arch: amd64, rpm_arch: x86_64 }
          - { id: linux-x64-intel, os: ubuntu-latest, platform: linux, arch: x64, deb_arch: amd64, rpm_arch: x86_64 }
          - { id: linux-x64-amd, os: ubuntu-latest, platform: linux, arch: x64, deb_arch: amd64, rpm_arch: x86_64 }
          - { id: linux-arm64, os: ubuntu-24.04-arm, platform: linux, arch: arm64, deb_arch: arm64, rpm_arch: aarch64 }
          # macOS
          - { id: mac-intel, os: macos-15-intel, platform: macos }
          - { id: mac-arm, os: macos-15, platform: macos }
          # Windows
          - { id: windows-x64-nvidia, os: windows-latest, platform: windows }
          - { id: windows-x64-intel, os: windows-latest, platform: windows }
          - { id: windows-x64-amd, os: windows-latest, platform: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download SAGE Backend
        uses: actions/download-artifact@v4
        with:
          name: sage-backend-${{ matrix.id }}
          path: backend

      # ==========================================
      # LINUX STAGES
      # ==========================================
      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm

      - name: Compile Flutter GUI (Linux)
        if: matrix.platform == 'linux'
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0

      - name: Inject SAGE Backend (Linux)
        if: matrix.platform == 'linux'
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          chmod 755 $BUNDLE/data/flutter_assets/backend_bundle/sage_backend

      - name: Build DEB Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          DEB_ROOT=build/linux/deb/StockD-1.2.0
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications
          tar -C $BUNDLE -cf - . | tar -xf - -C $DEB_ROOT/usr/lib/StockD-1.2.0/
          
          cat > $DEB_ROOT/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Type=Application
          Categories=Finance;Education;
          EOF
          
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          chmod 755 $DEB_ROOT/usr/lib/StockD-1.2.0/stockd
          
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd
          Version: 1.2.0
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: Gautam Mahajan
          Description: AI Stock App
          Depends: libgtk-3-0
          EOF
          
          dpkg-deb --root-owner-group -Znone --build $DEB_ROOT StockD-${{ matrix.id }}-1.2.0.deb

      - name: Build RPM Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          RPM_ROOT=$HOME/rpmbuild
          mkdir -p $RPM_ROOT/{SPECS,SOURCES,BUILD,BUILDROOT,RPMS}
          tar -czf $RPM_ROOT/SOURCES/StockD-1.2.0.tar.gz -C $BUNDLE .
          
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: StockD
          Version: 1.2.0
          Release: 1
          Summary: StockD App
          BuildArch: ${{ matrix.rpm_arch }}
          License: Proprietary
          Source0: StockD-1.2.0.tar.gz

          %description
          AI Coach.

          %prep
          %setup -c

          %install
          mkdir -p %{buildroot}/usr/lib/StockD-1.2.0 %{buildroot}/usr/bin %{buildroot}/usr/share/applications
          cp -r ./* %{buildroot}/usr/lib/StockD-1.2.0/
          chmod 755 %{buildroot}/usr/lib/StockD-1.2.0/stockd
          ln -s /usr/lib/StockD-1.2.0/stockd %{buildroot}/usr/bin/stockd
          printf '[Desktop Entry]\nName=StockD\nExec=/usr/bin/stockd\nType=Application\nCategories=Finance;\n' > %{buildroot}/usr/share/applications/stockd.desktop

          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          EOF
          
          rpmbuild -bb --define "__strip /bin/true" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/${{ matrix.rpm_arch }}/StockD-1.2.0-1.${{ matrix.rpm_arch }}.rpm StockD-${{ matrix.id }}-1.2.0.rpm

      # ==========================================
      # MACOS STAGES
      # ==========================================
      - name: Compile Flutter GUI (macOS)
        if: matrix.platform == 'macos'
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          find build/macos/Build/Products/Release/StockD.app -name "*.dSYM" -exec rm -rf {} +

      - name: Inject SAGE Backend (macOS)
        if: matrix.platform == 'macos'
        run: |
          DEST="build/macos/Build/Products/Release/StockD.app/Contents/Frameworks/App.framework/Resources/flutter_assets/backend_bundle"
          mkdir -p "$DEST"
          cp -r backend/* "$DEST/"

      - name: Build DMG Installer (macOS)
        if: matrix.platform == 'macos'
        run: |
          rm -f StockD-${{ matrix.id }}.dmg
          sleep 2
          hdiutil create -volname "StockD-${{ matrix.id }}" -srcfolder build/macos/Build/Products/Release/StockD.app -ov -format UDRW StockD-${{ matrix.id }}.dmg

      # ==========================================
      # WINDOWS STAGES
      # ==========================================
      - name: Compile Flutter GUI (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Inject SAGE Backend (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $assets = "build\windows\x64\runner\Release\data\flutter_assets\backend_bundle"
          New-Item -ItemType Directory -Force -Path $assets
          Copy-Item -Path "backend\*" -Destination $assets -Recurse

      - name: Build NSIS Setup (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          @"
          Name "StockD"
          OutFile "StockD-${{ matrix.id }}-setup.exe"
          InstallDir "`$PROGRAMFILES64\StockD"
          Section
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            CreateShortcut "`$DESKTOP\StockD.lnk" "`$INSTDIR\StockD.exe"
          SectionEnd
          "@ | Out-File -Encoding ASCII StockD.nsi
          makensis.exe StockD.nsi

      # ==========================================
      # FINAL UPLOAD
      # ==========================================
      - name: Upload Final OS Installers
        uses: actions/upload-artifact@v4
        with:
          name: StockD-${{ matrix.id }}-Installers
          path: |
            *.dmg
            *.deb
            *.rpm
            *-setup.exe
