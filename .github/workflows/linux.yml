name: Linux Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # THE DYNAMIC MATRIX GENERATOR
  # ==========================================
  setup-matrix:
    name: Configure Linux Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix JSON
        id: set-matrix
        shell: python
        run: |
          import json
          import os

          matrix = []
          
          # 1. Hardware-Optimized Target: Local Laptop NVIDIA GPU (CUDA Build)
          matrix.append({
            "id": "linux-x64-nvidia",
            "os": "self-hosted",
            "platform": "linux",
            "arch": "x64",
            "deb_arch": "amd64",
            "rpm_arch": "x86_64",
            "pkgs": "tensorflow[and-cuda]",
            "jobs": 6
          })

          # 2. Universal x64 Target: Combines Intel oneDNN Extensions + AMD Core CPU Fallbacks
          matrix.append({
            "id": "linux-x64-universal",
            "os": "self-hosted",
            "platform": "linux",
            "arch": "x64",
            "deb_arch": "amd64",
            "rpm_arch": "x86_64",
            "pkgs": "tensorflow intel-extension-for-tensorflow[cpu]",
            "jobs": 6
          })
          
          # 3. Cloud-Hosted Infrastructure Targeting Cloud ARM64 Systems
          matrix.append({
            "id": "linux-arm64",
            "os": "ubuntu-24.04-arm",
            "platform": "linux",
            "arch": "arm64",
            "deb_arch": "arm64",
            "rpm_arch": "aarch64",
            "pkgs": "tensorflow",
            "jobs": 4
          })

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"matrix={json.dumps(matrix)}\n")

  # ==========================================
  # THE HEAVY BUILD FACTORY
  # ==========================================
  build:
    name: Build (${{ matrix.id }})
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =====================================================
      # ENV PACKAGING DEPENDENCIES
      # =====================================================
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm dpkg-dev

      # =====================================================
      # COMPILATION ENGINE RUNTIME (CONDA VS PIP PROVISIONING)
      # =====================================================
      - name: Build Backend (Nuitka)
        shell: bash
        run: |
          export PIP_REQUIRE_VIRTUALENV=false
          export PYTHONNOUSERSITE=1

          if [ "${{ matrix.os }}" == "self-hosted" ]; then
            echo "Activating Local Workspace Conda Environment..."
            source /home/gautam/anaconda3/bin/activate ml
            conda install -y nuitka zstandard ordered-set scikit-learn pandas fastapi uvicorn -c conda-forge
            conda install -y yfinance -c conda-forge
            
            python -m pip install ${{ matrix.pkgs }} "protobuf<=3.20.3"
            PY_BIN="python"
          else
            echo "Provisioning Cloud-Hosted ARM64 Environment..."
            pip3 install --break-system-packages --ignore-installed nuitka zstandard ordered-set ${{ matrix.pkgs }} scikit-learn pandas yfinance fastapi uvicorn peewee
            PY_BIN="python3"
          fi

          # Compile application backend into a standalone native translation unit
          cd ML
          $PY_BIN -m nuitka main.py \
            --standalone \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --jobs=${{ matrix.jobs }} \
            --low-memory \
            --plugin-enable=anti-bloat \
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite

          mkdir -p ../backend
          cp -r dist/main.dist/* ../backend/
          mv ../backend/main.bin ../backend/sage_backend || mv ../backend/main ../backend/sage_backend || true
          chmod 755 ../backend/sage_backend
          rm -rf dist
          cd ..

      # =====================================================
      # UNIVERSAL AUTOMATIC DUPLICATE PROTOBUF CLEANUP
      # =====================================================
      - name: Purge Duplicate Build Protocol Files
        shell: bash
        run: |
          echo "Scanning for all duplicate protocol definitions..."
          find backend/ -name "*.proto" | awk -F/ '{print $NF}' | sort | uniq -d | while read -r dup; do
            echo "Found duplicate profile target: $dup! Purging redundancy..."
            find backend/ -name "$dup" | tail -n +2 | xargs rm -f
          done

      # =====================================================
      # FLUTTER GRAPHICAL INTERFACE ASSEMBLY
      # =====================================================
      - name: Compile Flutter GUI
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0

      - name: Inject SAGE Backend into Asset Bundle
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          chmod 755 $BUNDLE/data/flutter_assets/backend_bundle/sage_backend

      - name: Create System Desktop Entry File
        run: |
          mkdir -p linux_desktop
          cat > linux_desktop/stockd.desktop << 'EOF'
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF

      # =====================================================
      # NATIVE DEBIAN PACKAGING STRUCTURE (.DEB)
      # =====================================================
      - name: Build DEB Package
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          DEB_ROOT="package_root_${{ matrix.id }}"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cp assets/images/StockD.png $DEB_ROOT/usr/share/pixmaps/stockd.png
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          chmod 755 $DEB_ROOT/usr/lib/StockD-1.2.0/stockd
          
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-${{ matrix.id }}
          Version: 1.2.0
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: Gautam Mahajan
          Description: AI Stock App Optimized for ${{ matrix.id }}
          Depends: libgtk-3-0
          EOF
          
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-${{ matrix.id }}-1.2.0.deb
          rm -rf $DEB_ROOT

      # =====================================================
      # RED HAT ENTERPRISE PACKAGING STRUCTURE (.RPM)
      # =====================================================
      - name: Build RPM Package
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          RPM_ROOT=$HOME/rpmbuild
          
          rm -rf $RPM_ROOT/SPECS $RPM_ROOT/RPMS $RPM_ROOT/BUILDROOT $RPM_ROOT/BUILD
          mkdir -p $RPM_ROOT/{SPECS,RPMS}
          
          RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-${{ matrix.id }}-1.2.0-1.${{ matrix.rpm_arch }}"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_STAGE/usr/share/applications $RPM_STAGE/usr/share/pixmaps
          
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp assets/images/StockD.png $RPM_STAGE/usr/share/pixmaps/stockd.png
          cp linux_desktop/stockd.desktop $RPM_STAGE/usr/share/applications/
          ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          chmod 755 $RPM_STAGE/usr/lib/StockD-1.2.0/stockd
          
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          %define _use_internal_dependency_generator 0
          %define __find_requires %{nil}
          %define __find_provides %{nil}

          Name: StockD-${{ matrix.id }}
          Version: 1.2.0
          Release: 1
          Summary: StockD AI Stock App Optimized for ${{ matrix.id }}
          BuildArch: ${{ matrix.rpm_arch }}
          License: Proprietary
          %description
          AI Financial Literacy Coach.
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          /usr/share/pixmaps/stockd.png
          EOF
          
          rpmbuild -bb \
            --define "__strip /bin/true" \
            --define "_topdir $RPM_ROOT" \
            --buildroot "$RPM_STAGE" \
            $RPM_ROOT/SPECS/StockD.spec
            
          mv $RPM_ROOT/RPMS/${{ matrix.rpm_arch }}/*.rpm ./StockD-${{ matrix.id }}-1.2.0.rpm
          
          rm -rf $RPM_ROOT/SPECS $RPM_ROOT/BUILDROOT $RPM_ROOT/BUILD

      # =====================================================
      # HYBRID BINARY SHARDING ENGINE (>1.9GB PROTECTION)
      # =====================================================
      - name: Split Large Binaries
        shell: bash
        run: |
          for f in *.deb *.rpm 2>/dev/null; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
              if [ "$size" -gt 1990000000 ]; then
                echo "Splitting heavy build target portfolio: $f"
                split -b 1900M "$f" "${f}.part_"
                rm "$f"
              fi
            fi
          done

      # =====================================================
      # PRODUCTION UPLOAD INFRASTRUCTURE PIPELINE
      # =====================================================
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "StockD-1.2.0"
          make_latest: true
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            *.deb
            *.rpm
            *.part_*

      # =====================================================
      # LOCAL WORKSPACE DECONTAMINATION GUARDRAIL
      # =====================================================
      - name: Purge Residual Build Assets
        if: always()
        run: |
          echo "Purging localized binary output tracking matrices..."
          rm -rf build/ backend/ linux_desktop/ StockD-*.deb StockD-*.rpm 2>/dev/null || true
