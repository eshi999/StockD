name: Linux Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            deb_arch: amd64
            rpm_arch: x86_64
            pkgs: "tensorflow"
            jobs: 4
          - id: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            pkgs: "tensorflow"
            jobs: 4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka
          key: nuitka-${{ matrix.id }}-${{ github.sha }}
          restore-keys: nuitka-${{ matrix.id }}-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm dpkg-dev

      - name: Build Backend (Nuitka)
        shell: bash
        run: |
          pip3 install --break-system-packages nuitka zstandard ordered-set ${{ matrix.pkgs }} scikit-learn pandas yfinance fastapi uvicorn
          
          cd ML
          python3 -m nuitka main.py \
            --standalone \
            --plugin-enable=tensorflow \
            --plugin-enable=anti-bloat \
            --lto=no \
            --cflags="-mcmodel=large" \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --jobs=${{ matrix.jobs }} \
            --low-memory

          mkdir -p ../backend
          cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend
          
          cp -r artifacts ../backend/ 2>/dev/null || true
          cp *.keras *.pkl ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist
          cd ..

      - name: Purge Duplicate Build Protocol Files
        shell: bash
        run: |
          find backend/ -name "*.proto" | awk -F/ '{print $NF}' | sort | uniq -d | while read -r dup; do
            find backend/ -name "$dup" | tail -n +2 | xargs rm -f
          done

      - name: Compile Flutter GUI
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0

      - name: Inject SAGE Backend
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          chmod 755 $BUNDLE/data/flutter_assets/backend_bundle/sage_backend

      - name: Create System Desktop Entry File
        run: |
          mkdir -p linux_desktop
          cat > linux_desktop/stockd.desktop << 'EOF'
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF

      - name: Build DEB Package
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          DEB_ROOT="package_root_${{ matrix.id }}"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cp assets/images/StockD.png $DEB_ROOT/usr/share/pixmaps/stockd.png
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          chmod 755 $DEB_ROOT/usr/lib/StockD-1.2.0/stockd
          
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-${{ matrix.id }}
          Version: 1.2.0
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: Gautam Mahajan
          Description: AI Stock App Optimized for ${{ matrix.id }}
          Depends: libgtk-3-0
          EOF
          
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-${{ matrix.id }}-1.2.0.deb
          rm -rf $DEB_ROOT

      - name: Build RPM Package
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          RPM_ROOT=$HOME/rpmbuild
          
          rm -rf $RPM_ROOT/SPECS $RPM_ROOT/RPMS $RPM_ROOT/BUILDROOT $RPM_ROOT/BUILD
          mkdir -p $RPM_ROOT/{SPECS,RPMS}
          
          RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-${{ matrix.id }}-1.2.0-1.${{ matrix.rpm_arch }}"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_STAGE/usr/share/applications $RPM_STAGE/usr/share/pixmaps
          
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp assets/images/StockD.png $RPM_STAGE/usr/share/pixmaps/stockd.png
          cp linux_desktop/stockd.desktop $RPM_STAGE/usr/share/applications/
          ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          chmod 755 $RPM_STAGE/usr/lib/StockD-1.2.0/stockd
          
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          %global __requires_exclude .*
          %global __provides_exclude .*
          %global _missing_build_ids_terminate_build 0
          Name: StockD-${{ matrix.id }}
          Version: 1.2.0
          Release: 1
          Summary: StockD AI Stock App Optimized for ${{ matrix.id }}
          BuildArch: ${{ matrix.rpm_arch }}
          License: Proprietary
          %description
          AI Financial Literacy Coach.
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          /usr/share/pixmaps/stockd.png
          EOF
          
          rpmbuild -bb --nodeps --define "__strip /bin/true" --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/${{ matrix.rpm_arch }}/*.rpm ./StockD-${{ matrix.id }}-1.2.0.rpm
          rm -rf $RPM_ROOT/SPECS $RPM_ROOT/BUILDROOT $RPM_ROOT/BUILD

      - name: Split Large Binaries
        shell: bash
        run: |
          for f in *; do
            if [[ "$f" == *.deb || "$f" == *.rpm ]]; then
              if [ -f "$f" ]; then
                size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
                if [ "$size" -gt 1990000000 ]; then
                  split -b 1900M "$f" "${f}.part_"
                  rm -f "$f"
                fi
              fi
            fi
          done

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "StockD-1.2.0"
          make_latest: true
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            *.deb
            *.rpm
            *.part_*

      - name: Purge Residual Build Assets
        if: always()
        run: rm -rf build/ backend/ linux_desktop/ StockD-*.deb StockD-*.rpm 2>/dev/null || true
