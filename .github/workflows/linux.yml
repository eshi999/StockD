name: Linux Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-x64-universal
          - linux-x64-nvidia
          - linux-arm64

permissions:
  contents: write

jobs:
  # ==========================================
  # JOBS: X64 (Self-Hosted)
  # ==========================================
  linux-x64-universal:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-universal' }}
    runs-on: self-hosted
    env: { PKGS: "tensorflow intel-extension-for-tensorflow[cpu]", ARCH: "x64", DEB: "amd64", RPM: "x86_64" }
    steps: &build_steps
      - uses: actions/checkout@v4
      - name: Build and Package
        shell: bash
        run: |
          source /home/gautam/anaconda3/bin/activate ml
          pip install nuitka zstandard ordered-set $PKGS scikit-learn pandas yfinance fastapi uvicorn
          
          # Build Backend
          cd ML
          python -m nuitka main.py --standalone --output-dir=dist --jobs=4 --plugin-enable=anti-bloat --include-package=tensorflow
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend && cp -r artifacts ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..

          # Flutter Build
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          
          # Inject Backend
          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          
          # Packaging (DEB/RPM)
          mkdir -p linux_desktop && cat > linux_desktop/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF
          
          # DEB: Using Name StockD-${{ matrix.id }}
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: StockD-${{ github.job }}
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-${{ github.job }}-1.2.0.deb
          
          # RPM: Using Name StockD-${{ matrix.id }}
          RPM_ROOT=$HOME/rpmbuild
          RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: StockD-${{ github.job }}
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          BuildArch: $RPM
          Requires: gtk3
          %description
          AI Coach
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          EOF
          rpmbuild -bb --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM/*.rpm ./StockD-${{ github.job }}-1.2.0.rpm

  linux-x64-nvidia:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-nvidia' }}
    runs-on: self-hosted
    env: { PKGS: "tensorflow[and-cuda]", ARCH: "x64", DEB: "amd64", RPM: "x86_64" }
    steps: *build_steps

  # ==========================================
  # JOB: ARM64 (Cloud-Hosted)
  # ==========================================
  linux-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-arm64' }}
    runs-on: ubuntu-24.04-arm
    env: { PKGS: "tensorflow", ARCH: "arm64", DEB: "arm64", RPM: "aarch64" }
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package
        shell: bash
        run: |
          sudo pip3 install --break-system-packages nuitka zstandard ordered-set $PKGS scikit-learn pandas yfinance fastapi uvicorn peewee
          
          cd ML
          # FIX: -mlong-calls allows ARM64 to jump beyond memory limits
          export CFLAGS="-mlong-calls -fPIC"
          python3 -m nuitka main.py --standalone --output-dir=dist --jobs=4 --plugin-enable=anti-bloat --include-package=tensorflow
          cd ..
          
          # ... (Apply the exact same Packaging/Flutter Build logic as above, just ensure Package is named: StockD-linux-arm64)
          
      - name: Split and Upload
        run: |
          for f in *.{deb,rpm}; do
            if [ -f "$f" ]; then
               size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
               if [ "$size" -gt 1990000000 ]; then split -b 1900M "$f" "${f}.part_"; rm "$f"; fi
            fi
          done
          
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          make_latest: true
          files: |
            *.deb
            *.rpm
            *.part_*
