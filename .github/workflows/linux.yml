name: Linux Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options: [all, linux-x64-universal, linux-x64-nvidia, linux-arm64]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.build_target }}
  cancel-in-progress: true


jobs:
  # ==========================================
  # JOB: X64 UNIVERSAL (Self-Hosted)
  # ==========================================
  linux-x64-universal:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-universal' }}
    runs-on: self-hosted
    env: {ARCH: "x64", DEB: "amd64", RPM: "x86_64", JOB_ID: "x64-universal" }

    steps:
      - uses: actions/checkout@v4

      - name: Build and Package
        shell: bash
        run: |
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate StockD_build_cpu

          TF_ROOT=$(python -c "import tensorflow as tf; import os; print(os.path.dirname(tf.__file__))")

          # ======================================
          # BACKEND BUILD (UNCHANGED CORE LOGIC)
          # ======================================
          cd ML
          python -m nuitka main.py \
            --standalone --lto=no --assume-yes-for-downloads \
            --output-dir=dist --jobs=6 --low-memory \
            --include-package=tensorflow \
            --plugin-enable=tensorflow \
            --include-plugin-directory="$TF_ROOT" \
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite,torch

          mkdir -p ../backend
          cp -r dist/main.dist/* ../backend/

          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend

          cp -r artifacts *.keras *.pkl ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..

          # ======================================
          # 🔥 FIX: CREATE ISOLATED PYTHON RUNTIME
          # ======================================
          python -m venv backend/python_env
          source backend/python_env/bin/activate

          pip install -U pip
          pip install fastapi uvicorn peewee yfinance numpy pandas scipy blosc2

          # ======================================
          # FLUTTER BUILD
          # ======================================
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0

          BUNDLE="build/linux/$ARCH/release/bundle"

          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/

          # ======================================
          # FIXED DESKTOP ENTRY (NO BROKEN EXEC)
          # ======================================
          cat > $BUNDLE/stockd.desktop << EOF
[Desktop Entry]
Name=StockD
Exec=/usr/bin/stockd
Icon=stockd
Type=Application
Categories=Finance;Utility;
EOF

          # ======================================
          # DEB PACKAGE
          # ======================================
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/usr/lib/StockD-1.2.0 \
                   $DEB_ROOT/usr/bin \
                   $DEB_ROOT/DEBIAN

          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/

          # 🔥 FIX: REAL EXEC WRAPPER (not direct binary)
          cat > $DEB_ROOT/usr/bin/stockd << 'EOF'
#!/bin/bash
DIR="/usr/lib/StockD-1.2.0/backend_bundle"
export PYTHONPATH="$DIR"
exec "$DIR/sage_backend"
EOF

          chmod +x $DEB_ROOT/usr/bin/stockd

          cat > $DEB_ROOT/DEBIAN/control << EOF
Package: stockd-linux-x64-universal
Version: 1.2.0
Architecture: amd64
Maintainer: Gautam Mahajan
Description: StockD AI Application
EOF

          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-x64-universal-1.2.0.deb

      - name: Cleanup
        if: always()
        run: rm -rf pkg_deb backend build

      - name: Deploy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: "*.deb"



  # ==========================================
  # JOB: X64 NVIDIA (Self-Hosted)
  # ==========================================
  linux-x64-nvidia:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-nvidia' }}
    runs-on: self-hosted
    env: {ARCH: "x64", DEB: "amd64", RPM: "x86_64", JOB_ID: "x64-nvidia" }

    steps:
      - uses: actions/checkout@v4

      - name: Build and Package
        shell: bash
        run: |
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate StockD_build_cuda

          # 🔥 FIX: prevent broken conda GL leaking into EGL
          unset LD_LIBRARY_PATH

          TF_ROOT=$(python -c "import tensorflow as tf; import os; print(os.path.dirname(tf.__file__))")

          cd ML
          python -m nuitka main.py \
            --standalone --lto=no --assume-yes-for-downloads \
            --output-dir=dist --jobs=6 --low-memory \
            --include-package=tensorflow \
            --plugin-enable=tensorflow \
            --include-plugin-directory="$TF_ROOT" \
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite,torch

          mkdir -p ../backend
          cp -r dist/main.dist/* ../backend/

          mv ../backend/main ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend

          cp -r artifacts *.keras *.pkl ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..

          # 🔥 SAME FIX AS CPU: isolated runtime
          python -m venv backend/python_env
          source backend/python_env/bin/activate
          pip install -U pip
          pip install fastapi uvicorn peewee yfinance numpy pandas scipy blosc2

          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0

          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/

          cat > $BUNDLE/stockd.desktop << EOF
[Desktop Entry]
Name=StockD
Exec=/usr/bin/stockd
Icon=stockd
Type=Application
Categories=Finance;Utility;
EOF

          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/bin $DEB_ROOT/DEBIAN
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/

          cat > $DEB_ROOT/usr/bin/stockd << 'EOF'
#!/bin/bash
DIR="/usr/lib/StockD-1.2.0/backend_bundle"
export PYTHONPATH="$DIR"
exec "$DIR/sage_backend"
EOF

          chmod +x $DEB_ROOT/usr/bin/stockd

          cat > $DEB_ROOT/DEBIAN/control << EOF
Package: stockd-linux-x64-nvidia
Version: 1.2.0
Architecture: amd64
Maintainer: Gautam Mahajan
Description: StockD AI Application
EOF

          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-x64-nvidia-1.2.0.deb

      - name: Cleanup
        if: always()
        run: rm -rf pkg_deb backend build

      - name: Deploy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: "*.deb"



  # ==========================================
  # JOB: ARM64 (Cloud-Hosted)
  # ==========================================
  linux-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-arm64' }}
    runs-on: ubuntu-24.04-arm
    env: { PKGS: "tensorflow", ARCH: "arm64", DEB: "arm64", RPM: "aarch64", JOB_ID: "arm64" }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev
          git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Build and Package
        run: |
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm dpkg-dev

          python3 -m pip install nuitka fastapi uvicorn peewee numpy pandas scipy ${PKGS}

          python3 -m nuitka ML/main.py \
            --standalone --output-dir=dist --jobs=2 --low-memory --clang \
            --include-package=tensorflow \
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite

          mkdir -p backend
          cp -r dist/main.dist/* backend/

          mv backend/main backend/sage_backend 2>/dev/null || true
          chmod 755 backend/sage_backend

          flutter build linux --release --build-name=1.2.0

          BUNDLE="build/linux/arm64/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/

          cat > $BUNDLE/stockd.desktop << EOF
[Desktop Entry]
Name=StockD
Exec=/usr/bin/stockd
Icon=stockd
Type=Application
Categories=Finance;Utility;
EOF

          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/bin $DEB_ROOT/DEBIAN
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/

          cat > $DEB_ROOT/usr/bin/stockd << 'EOF'
#!/bin/bash
DIR="/usr/lib/StockD-1.2.0/backend_bundle"
export PYTHONPATH="$DIR"
exec "$DIR/sage_backend"
EOF

          chmod +x $DEB_ROOT/usr/bin/stockd

          cat > $DEB_ROOT/DEBIAN/control << EOF
Package: stockd-linux-arm64
Version: 1.2.0
Architecture: arm64
Maintainer: Gautam Mahajan
Description: StockD AI Application
EOF

          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-arm64-1.2.0.deb

      - name: Cleanup
        if: always()
        run: rm -rf pkg_deb backend build

      - name: Deploy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: "*.deb"
