name: Linux Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options: [all, linux-x64-universal, linux-x64-nvidia, linux-arm64]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.build_target }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # X64 UNIVERSAL
  # =========================================================
  linux-x64-universal:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-universal' }}
    runs-on: ubuntu-24.04
    env: { ARCH: "x64", JOB_ID: "x64-universal", DEB: "amd64", RPM_ARCH: "x86_64" }
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package
        shell: bash
        run: |
          cd ML && python -m nuitka main.py --standalone --lto=no --output-dir=dist --include-package=tensorflow --plugin-enable=tensorflow --low-memory 
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/ && mv ../backend/main ../backend/sage_backend 2>/dev/null || true
          chmod +x ../backend/sage_backend && cd ..
          python3 -m venv backend/python_env && source backend/python_env/bin/activate && pip install -U pip && pip install fastapi uvicorn numpy pandas scipy peewee yfinance
          flutter config --enable-linux-desktop && flutter build linux --release --build-name=1.2.0
          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle && cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          
          # DEB
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/{usr/lib/StockD-1.2.0,usr/bin,usr/share/applications,DEBIAN}
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cat > $DEB_ROOT/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;
          Terminal=false
          EOF
          chmod 644 $DEB_ROOT/usr/share/applications/stockd.desktop
          cat > $DEB_ROOT/usr/bin/stockd << 'EOF'
          #!/bin/bash
          export PYTHONPATH="/usr/lib/StockD-1.2.0/backend_bundle"
          exec /usr/lib/StockD-1.2.0/sage_backend
          EOF
          chmod +x $DEB_ROOT/usr/bin/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-linux-x64-universal
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI Application
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-x64-universal-1.2.0.deb

          # RPM
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE=$RPM_ROOT/BUILDROOT/StockD-1.2.0
          mkdir -p $RPM_STAGE/{usr/lib/StockD-1.2.0,usr/bin,usr/share/applications} $RPM_ROOT/SPECS
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp $DEB_ROOT/usr/share/applications/stockd.desktop $RPM_STAGE/usr/share/applications/
          cp $DEB_ROOT/usr/bin/stockd $RPM_STAGE/usr/bin/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: stockd
          Version: 1.2.0
          Release: 1
          Summary: StockD AI Application
          License: Proprietary
          %description
          StockD AI application.
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          EOF
          rpmbuild -bb --nodeps --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM_ARCH/*.rpm ./StockD-linux-x64-universal-1.2.0.rpm

  # =========================================================
  # X64 NVIDIA
  # =========================================================
  linux-x64-nvidia:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-nvidia' }}
    runs-on: ubuntu-24.04
    env: { ARCH: "x64", JOB_ID: "x64-nvidia", DEB: "amd64", RPM_ARCH: "x86_64" }
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package
        shell: bash
        run: |
          cd ML && python -m nuitka main.py --standalone --low-memory --lto=no --output-dir=dist --include-package=tensorflow --plugin-enable=tensorflow 
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/ && mv ../backend/main ../backend/sage_backend 2>/dev/null || true
          chmod +x ../backend/sage_backend && cd ..
          python3 -m venv backend/python_env && source backend/python_env/bin/activate && pip install -U pip && pip install fastapi uvicorn numpy pandas scipy peewee yfinance
          flutter config --enable-linux-desktop && flutter build linux --release --build-name=1.2.0
          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle && cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/{usr/lib/StockD-1.2.0,usr/bin,usr/share/applications,DEBIAN}
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cat > $DEB_ROOT/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;
          Terminal=false
          EOF
          chmod 644 $DEB_ROOT/usr/share/applications/stockd.desktop
          cat > $DEB_ROOT/usr/bin/stockd << 'EOF'
          #!/bin/bash
          export PYTHONPATH="/usr/lib/StockD-1.2.0/backend_bundle"
          exec /usr/lib/StockD-1.2.0/sage_backend
          EOF
          chmod +x $DEB_ROOT/usr/bin/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-linux-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI Application
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-x64-nvidia-1.2.0.deb
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE=$RPM_ROOT/BUILDROOT/StockD-1.2.0
          mkdir -p $RPM_STAGE/{usr/lib/StockD-1.2.0,usr/bin,usr/share/applications} $RPM_ROOT/SPECS
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp $DEB_ROOT/usr/share/applications/stockd.desktop $RPM_STAGE/usr/share/applications/
          cp $DEB_ROOT/usr/bin/stockd $RPM_STAGE/usr/bin/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: stockd
          Version: 1.2.0
          Release: 1
          Summary: StockD AI Application
          License: Proprietary
          %description
          StockD AI application.
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          EOF
          rpmbuild -bb --nodeps --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM_ARCH/*.rpm ./StockD-linux-x64-nvidia-1.2.0.rpm

  # =========================================================
  # ARM64
  # =========================================================
  linux-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-arm64' }}
    runs-on: ubuntu-24.04-arm
    env: { ARCH: "arm64", JOB_ID: "arm64", DEB: "arm64", RPM_ARCH: "aarch64" }
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package
        run: |
          sudo apt-get update && sudo apt-get install -y rpm git curl unzip zip clang cmake ninja-build pkg-config libgtk-3-dev
          python3 -m venv backend/python_env && source backend/python_env/bin/activate && pip install -U pip && pip install fastapi uvicorn numpy pandas scipy peewee yfinance
          python3 -m nuitka ML/main.py --standalone --low-memory --lto=no --output-dir=dist --include-package=tensorflow --plugin-enable=tensorflow --clang
          mkdir -p backend && cp -r dist/main.dist/* backend/ && mv backend/main backend/sage_backend 2>/dev/null || true
          chmod +x backend/sage_backend && flutter build linux --release --build-name=1.2.0
          BUNDLE="build/linux/arm64/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle && cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/{usr/lib/StockD-1.2.0,usr/bin,usr/share/applications,DEBIAN}
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cat > $DEB_ROOT/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;
          Terminal=false
          EOF
          chmod 644 $DEB_ROOT/usr/share/applications/stockd.desktop
          cat > $DEB_ROOT/usr/bin/stockd << 'EOF'
          #!/bin/bash
          export PYTHONPATH="/usr/lib/StockD-1.2.0/backend_bundle"
          exec /usr/lib/StockD-1.2.0/sage_backend
          EOF
          chmod +x $DEB_ROOT/usr/bin/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-linux-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI Application
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-arm64-1.2.0.deb
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE=$RPM_ROOT/BUILDROOT/StockD-1.2.0
          mkdir -p $RPM_STAGE/{usr/lib/StockD-1.2.0,usr/bin,usr/share/applications} $RPM_ROOT/SPECS
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp $DEB_ROOT/usr/share/applications/stockd.desktop $RPM_STAGE/usr/share/applications/
          cp $DEB_ROOT/usr/bin/stockd $RPM_STAGE/usr/bin/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: stockd
          Version: 1.2.0
          Release: 1
          Summary: StockD AI Application
          License: Proprietary
          %description
          StockD AI application.
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          EOF
          rpmbuild -bb --nodeps --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM_ARCH/*.rpm ./StockD-linux-arm64-1.2.0.rpm

  # =========================================================
  # RELEASE
  # =========================================================
  release:
    needs: [linux-x64-universal, linux-x64-nvidia, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          files: |
            *.deb
            *.rpm
