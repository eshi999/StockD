name: Linux Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-x64-universal
          - linux-x64-nvidia
          - linux-arm64

permissions:
  contents: write

jobs:
  # ── JOB 1: X64 UNIVERSAL ──
  linux-x64-universal:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-universal' }}
    runs-on: self-hosted
    env: &env_vars
      PKGS: "tensorflow"
      ARCH: "x64"
      DEB_ARCH: "amd64"
      RPM_ARCH: "x86_64"
      JOBS: 4
    steps: &build_steps
      - uses: actions/checkout@v4
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka
          key: nuitka-${{ github.job }}-${{ github.sha }}
          restore-keys: nuitka-${{ github.job }}-
      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm dpkg-dev
      - name: Build Backend (Nuitka)
        shell: bash
        run: |
          pip3 install --break-system-packages nuitka zstandard ordered-set $PKGS scikit-learn pandas yfinance fastapi uvicorn
          cd ML
          # Set the environment variable just for this command
          CFLAGS="-mcmodel=medium -fPIC" python3 -m nuitka main.py \
            --standalone \
            --plugin-enable=tensorflow \
            --plugin-enable=anti-bloat \
            --lto=no \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --jobs=$JOBS \
            --low-memory
          
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend && cp -r artifacts ../backend/ 2>/dev/null || true && cp *.keras *.pkl ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..
      - name: Purge Duplicate Build Protocol Files
        run: find backend/ -name "*.proto" | awk -F/ '{print $NF}' | sort | uniq -d | while read -r dup; do find backend/ -name "$dup" | tail -n +2 | xargs rm -f; done
      - name: Compile Flutter GUI
        run: flutter config --enable-linux-desktop && flutter build linux --release --build-name=1.2.0
      - name: Inject SAGE Backend
        run: |
          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle && cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          chmod 755 $BUNDLE/data/flutter_assets/backend_bundle/sage_backend
      - name: Create Desktop Entry
        run: |
          mkdir -p linux_desktop
          cat > linux_desktop/stockd.desktop << 'EOF'
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF
      - name: Build DEB Package
        run: |
          BUNDLE="build/linux/$ARCH/release/bundle"
          DEB_ROOT="package_root_$ARCH"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/ && cp assets/images/StockD.png $DEB_ROOT/usr/share/pixmaps/stockd.png
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/ && ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-$ARCH
          Version: 1.2.0
          Architecture: $DEB_ARCH
          Maintainer: Gautam Mahajan
          Description: AI Stock App
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-$ARCH-1.2.0.deb && rm -rf $DEB_ROOT
      - name: Build RPM Package
        run: |
          BUNDLE="build/linux/$ARCH/release/bundle"
          RPM_ROOT=$HOME/rpmbuild && mkdir -p $RPM_ROOT/{SPECS,RPMS}
          RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-$ARCH-1.2.0-1.$RPM_ARCH"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_STAGE/usr/share/applications $RPM_STAGE/usr/share/pixmaps
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/ && cp assets/images/StockD.png $RPM_STAGE/usr/share/pixmaps/stockd.png
          cp linux_desktop/stockd.desktop $RPM_STAGE/usr/share/applications/ && ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: StockD-$ARCH
          Version: 1.2.0
          Release: 1
          Summary: AI Stock App
          BuildArch: $RPM_ARCH
          License: Proprietary
          %description
          AI Financial Literacy Coach.
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          /usr/share/pixmaps/stockd.png
          EOF
          rpmbuild -bb --nodeps --define "__strip /bin/true" --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM_ARCH/*.rpm ./StockD-$ARCH-1.2.0.rpm && rm -rf $RPM_ROOT/SPECS $RPM_ROOT/BUILDROOT $RPM_ROOT/BUILD
      - name: Split Large Binaries
        shell: bash
        run: |
          for f in *.{deb,rpm}; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 1990000000 ]; then split -b 1900M "$f" "${f}.part_"; rm -f "$f"; fi
          done
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "StockD-1.2.0"
          make_latest: true
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            *.deb
            *.rpm
            *.part_*
      - name: Purge Assets
        if: always()
        run: rm -rf build/ backend/ linux_desktop/ StockD-*.deb StockD-*.rpm 2>/dev/null || true

  # ── JOB 2: NVIDIA ──
  linux-x64-nvidia:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-nvidia' }}
    runs-on: self-hosted
    env:
      PKGS: "tensorflow[and-cuda]"
      ARCH: "x64"
      DEB_ARCH: "amd64"
      RPM_ARCH: "x86_64"
      JOBS: 4
    steps: *build_steps

  # ── JOB 3: ARM64 ──
  linux-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-arm64' }}
    runs-on: ubuntu-24.04-arm
    env:
      PKGS: "tensorflow"
      ARCH: "arm64"
      DEB_ARCH: "arm64"
      RPM_ARCH: "aarch64"
      JOBS: 2
    steps: *build_steps
