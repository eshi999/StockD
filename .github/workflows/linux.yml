name: Linux Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options: [all, linux-x64-universal, linux-x64-nvidia, linux-arm64]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.build_target }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB: X64 UNIVERSAL (Self-Hosted)
  # ==========================================
  linux-x64-universal:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-universal' }}
    runs-on: self-hosted
    env: {ARCH: "x64", DEB: "amd64", RPM: "x86_64", JOB_ID: "x64-universal" }
    steps:
      - uses: actions/checkout@v4

      - name: Build and Package
        shell: bash
        run: |
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate StockD_build_cpu
          TF_ROOT=$(python -c "import tensorflow as tf; import os; print(os.path.dirname(tf.__file__))")
          
          cd ML
          python -m nuitka main.py --standalone --lto=no --assume-yes-for-downloads --output-dir=dist --jobs=6 --low-memory --include-package=tensorflow --plugin-enable=tensorflow --include-plugin-directory="$TF_ROOT" --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite,torch
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend
          cp -r artifacts *.keras *.pkl ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..

          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle && cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          echo -e "[Desktop Entry]\nName=StockD\nExec=/usr/bin/stockd\nIcon=stockd\nType=Application\nCategories=Finance;Utility;" > $BUNDLE/stockd.desktop

          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          ln -s /usr/lib/StockD-1.2.0/sage_backend $DEB_ROOT/usr/bin/stockd
          cp $BUNDLE/stockd.desktop $DEB_ROOT/usr/share/applications/
          cp assets/images/stockd.png $DEB_ROOT/usr/share/pixmaps/stockd.png || touch $DEB_ROOT/usr/share/pixmaps/stockd.png
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-linux-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-$JOB_ID-1.2.0.deb

          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: stockd-linux-$JOB_ID
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          %global __requires_exclude_from ^/usr/lib/StockD-1.2.0/.*$
          %files
          /usr/lib/StockD-1.2.0
          EOF
          rpmbuild -bb --nodeps --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM/*.rpm ./StockD-linux-$JOB_ID-1.2.0.rpm

      - name: Cleanup
        if: always()
        run: rm -rf pkg_deb $HOME/rpmbuild build backend

      - name: Deploy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite: true
          fail_on_unmatched_files: true
          files: |
            *.deb
            *.rpm

  # ==========================================
  # JOB: X64 NVIDIA (Self-Hosted)
  # ==========================================
  linux-x64-nvidia:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-nvidia' }}
    runs-on: self-hosted
    env: {ARCH: "x64", DEB: "amd64", RPM: "x86_64", JOB_ID: "x64-nvidia" }
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package
        shell: bash
        run: |
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate StockD_build_cuda
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(find /home/gautam/miniconda3/envs/StockD_build_cuda -name "lib" | grep "nvidia" | tr '\n' ':')
          TF_ROOT=$(python -c "import tensorflow as tf; import os; print(os.path.dirname(tf.__file__))")

          cd ML
          python -m nuitka main.py --standalone --lto=no --assume-yes-for-downloads --output-dir=dist --jobs=6 --low-memory --include-package=tensorflow --plugin-enable=tensorflow --include-plugin-directory="$TF_ROOT" --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite,torch
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend
          cp -r artifacts *.keras *.pkl ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..
          
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle && cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          echo -e "[Desktop Entry]\nName=StockD\nExec=/usr/bin/stockd\nIcon=stockd\nType=Application\nCategories=Finance;Utility;" > $BUNDLE/stockd.desktop

          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          ln -s /usr/lib/StockD-1.2.0/sage_backend $DEB_ROOT/usr/bin/stockd
          cp $BUNDLE/stockd.desktop $DEB_ROOT/usr/share/applications/
          cp assets/images/stockd.png $DEB_ROOT/usr/share/pixmaps/stockd.png || touch $DEB_ROOT/usr/share/pixmaps/stockd.png
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-linux-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-$JOB_ID-1.2.0.deb

          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: stockd-linux-$JOB_ID
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          %global __requires_exclude_from ^/usr/lib/StockD-1.2.0/.*$
          %files
          /usr/lib/StockD-1.2.0
          EOF
          rpmbuild -bb --nodeps --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM/*.rpm ./StockD-linux-$JOB_ID-1.2.0.rpm

      - name: Cleanup
        if: always()
        run: rm -rf pkg_deb $HOME/rpmbuild build backend

      - name: Deploy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite: true
          fail_on_unmatched_files: true
          files: |
            *.deb
            *.rpm

  # ==========================================
  # JOB: ARM64 (Cloud-Hosted)
  # ==========================================
  linux-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-arm64' }}
    runs-on: ubuntu-24.04-arm
    env: { PKGS: "tensorflow", ARCH: "arm64", DEB: "arm64", RPM: "aarch64", JOB_ID: "arm64" }
    steps:
      - uses: actions/checkout@v4
      - name: Flutter Setup
        run: |
          sudo apt-get update && sudo apt-get install -y git curl unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev
          git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - name: Build and Package
        run: |
          export PATH="$PATH:$HOME/flutter/bin"
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm dpkg-dev
          python3 -m pip install nuitka zstandard ordered-set yfinance fastapi uvicorn peewee blosc2 scipy numpy pandas ${PKGS}
          
          python3 -m nuitka ML/main.py --standalone --output-dir=dist --jobs=2 --low-memory --clang --include-package=tensorflow --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite
          
          mkdir -p backend && cp -r dist/main.dist/* backend/
          cp ML/*.keras ML/*.pkl ML/ml_config.py backend/
          mv backend/main backend/sage_backend 2>/dev/null || mv backend/main.bin backend/sage_backend 2>/dev/null || true
          chmod 755 backend/sage_backend
          
          flutter build linux --release --build-name=1.2.0
          BUNDLE="build/linux/arm64/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle && cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          echo -e "[Desktop Entry]\nName=StockD\nExec=/usr/bin/stockd\nIcon=stockd\nType=Application\nCategories=Finance;Utility;" > $BUNDLE/stockd.desktop

          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          ln -s /usr/lib/StockD-1.2.0/sage_backend $DEB_ROOT/usr/bin/stockd
          cp $BUNDLE/stockd.desktop $DEB_ROOT/usr/share/applications/
          cp assets/images/stockd.png $DEB_ROOT/usr/share/pixmaps/stockd.png || touch $DEB_ROOT/usr/share/pixmaps/stockd.png
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-linux-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-$JOB_ID-1.2.0.deb
          
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: stockd-linux-$JOB_ID
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          %global __requires_exclude_from ^/usr/lib/StockD-1.2.0/.*$
          %files
          /usr/lib/StockD-1.2.0
          EOF
          rpmbuild -bb --nodeps --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/aarch64/*.rpm ./StockD-linux-$JOB_ID-1.2.0.rpm

      - name: Cleanup
        if: always()
        run: rm -rf pkg_deb $HOME/rpmbuild build backend

      - name: Deploy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite: true
          fail_on_unmatched_files: true
          files: |
            *.deb
            *.rpm
