name: Linux Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options: [all, linux-x64-universal, linux-x64-nvidia, linux-arm64]

permissions:
  contents: write

concurrency:
  group: self-hosted-linux-build
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB: X64 UNIVERSAL (Self-Hosted)
  # ==========================================
  linux-x64-universal:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-universal' }}
    runs-on: self-hosted
    env: {ARCH: "x64", DEB: "amd64", RPM: "x86_64", JOB_ID: "x64-universal" }
    steps:
      - uses: actions/checkout@v4

      - name: Build and Package Backend (Nuitka)
        shell: bash
        run: |
          export PYTHONNOUSERSITE=1
          export PIP_REQUIRE_VIRTUALENV=false
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate StockD_build_cpu

          # Build Backend
          cd ML
          python -m nuitka main.py \
            --standalone \
            --lto=no \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --jobs=6 \
            --low-memory \
            --plugin-enable=anti-bloat \
            --include-package=tensorflow \
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend
          cp -r artifacts ../backend/ 2>/dev/null || true
          cp *.keras ../backend/ 2>/dev/null || true
          cp *.pkl ../backend/ 2>/dev/null || true
          cp ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..

          # Flutter Build
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0

          # Inject Backend
          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/

          # Desktop Entry
          mkdir -p linux_desktop && cat > linux_desktop/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF

          # DEB Packaging
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/
          cp assets/images/StockD.png $DEB_ROOT/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          chmod 755 $DEB_ROOT/usr/lib/StockD-1.2.0/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-linux-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          License: Proprietary
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-$JOB_ID-1.2.0.deb

          # RPM Packaging
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          rm -rf $RPM_ROOT/SPECS $RPM_ROOT/BUILDROOT $RPM_ROOT/BUILD
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS $RPM_STAGE/usr/share/pixmaps $RPM_STAGE/usr/share/applications
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $RPM_STAGE/usr/share/applications/
          cp assets/images/StockD.png $RPM_STAGE/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          chmod 755 $RPM_STAGE/usr/lib/StockD-1.2.0/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          %global __requires_exclude .*
          %global __provides_exclude .*
          %global _missing_build_ids_terminate_build 0
          Name: stockd-linux-$JOB_ID
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          BuildArch: $RPM
          License: Proprietary
          %description
          AI Coach
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          /usr/share/pixmaps/stockd.png
          EOF
          rpmbuild -bb --nodeps \
            --define "__strip /bin/true" \
            --define "_topdir $RPM_ROOT" \
            --buildroot "$RPM_STAGE" \
            $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM/*.rpm ./StockD-linux-$JOB_ID-1.2.0.rpm

      - name: Verify Backend Bundle
        shell: bash
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          echo "=== Backend bundle size ==="
          du -sh $BUNDLE/data/flutter_assets/backend_bundle/
          echo "=== CUDA libraries present ==="
          ls $BUNDLE/data/flutter_assets/backend_bundle/ | grep -i "cuda\|cublas\|cudnn" || echo "No CUDA libs found"
          echo "=== Intel extension present ==="
          ls $BUNDLE/data/flutter_assets/backend_bundle/ | grep -i "intel\|itex" || echo "No Intel extension found"
          echo "=== Total file count ==="
          find $BUNDLE/data/flutter_assets/backend_bundle/ -type f | wc -l

      - name: Split and Upload
        run: |
          for f in *.{deb,rpm}; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 1990000000 ]; then split -b 1900M "$f" "${f}.part_"; rm "$f"; fi
          done

      - name: Deploy to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "StockD-1.2.0"
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            *.deb
            *.rpm
            *.part_*

      - name: Cleanup
        if: always()
        run: rm -rf build/ backend/ pkg_deb/ $HOME/rpmbuild/ linux_desktop/ dist/

  # ==========================================
  # JOB: X64 NVIDIA (Self-Hosted)
  # ==========================================
  linux-x64-nvidia:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-nvidia' }}
    needs: linux-x64-universal
    runs-on: self-hosted
    env: {ARCH: "x64", DEB: "amd64", RPM: "x86_64", JOB_ID: "x64-nvidia" }
    steps:
      - uses: actions/checkout@v4

      - name: Build and Package Backend (Nuitka)
        shell: bash
        run: |
          export PYTHONNOUSERSITE=1
          export PIP_REQUIRE_VIRTUALENV=false
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate StockD_build_cuda

          # Build Backend
          cd ML
          python -m nuitka main.py \
            --standalone \
            --lto=no \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --jobs=6 \
            --low-memory \
            --plugin-enable=anti-bloat \
            --include-package=tensorflow \
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend
          cp -r artifacts ../backend/ 2>/dev/null || true
          cp *.keras ../backend/ 2>/dev/null || true
          cp *.pkl ../backend/ 2>/dev/null || true
          cp ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..

          # Flutter Build
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0

          # Inject Backend
          BUNDLE="build/linux/x64/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/

          # Desktop Entry
          mkdir -p linux_desktop && cat > linux_desktop/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF

          # DEB Packaging
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/
          cp assets/images/StockD.png $DEB_ROOT/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          chmod 755 $DEB_ROOT/usr/lib/StockD-1.2.0/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: stockd-linux-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          License: Proprietary
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-linux-$JOB_ID-1.2.0.deb

          # RPM Packaging
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          rm -rf $RPM_ROOT/SPECS $RPM_ROOT/BUILDROOT $RPM_ROOT/BUILD
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS $RPM_STAGE/usr/share/pixmaps $RPM_STAGE/usr/share/applications
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $RPM_STAGE/usr/share/applications/
          cp assets/images/StockD.png $RPM_STAGE/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          chmod 755 $RPM_STAGE/usr/lib/StockD-1.2.0/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          %global __requires_exclude .*
          %global __provides_exclude .*
          %global _missing_build_ids_terminate_build 0
          Name: stockd-linux-$JOB_ID
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          BuildArch: $RPM
          License: Proprietary
          %description
          AI Coach
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          /usr/share/pixmaps/stockd.png
          EOF
          rpmbuild -bb --nodeps \
            --define "__strip /bin/true" \
            --define "_topdir $RPM_ROOT" \
            --buildroot "$RPM_STAGE" \
            $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM/*.rpm ./StockD-linux-$JOB_ID-1.2.0.rpm

      - name: Verify Backend Bundle
        shell: bash
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          echo "=== Backend bundle size ==="
          du -sh $BUNDLE/data/flutter_assets/backend_bundle/
          echo "=== CUDA libraries present ==="
          ls $BUNDLE/data/flutter_assets/backend_bundle/ | grep -i "cuda\|cublas\|cudnn" || echo "No CUDA libs found"
          echo "=== Intel extension present ==="
          ls $BUNDLE/data/flutter_assets/backend_bundle/ | grep -i "intel\|itex" || echo "No Intel extension found"
          echo "=== Total file count ==="
          find $BUNDLE/data/flutter_assets/backend_bundle/ -type f | wc -l

      - name: Split and Upload
        run: |
          for f in *.{deb,rpm}; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 1990000000 ]; then split -b 1900M "$f" "${f}.part_"; rm "$f"; fi
          done

      - name: Deploy to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "StockD-1.2.0"
