name: Linux Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select target build architecture'
        required: true
        default: 'all'
        type: choice
        options: [all, linux-x64-universal, linux-x64-nvidia, linux-arm64]

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB: X64 UNIVERSAL (Self-Hosted)
  # ==========================================
  linux-x64-universal:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-universal' }}
    runs-on: self-hosted
    env: {ARCH: "x64", DEB: "amd64", RPM: "x86_64", JOB_ID: "x64-universal" }
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package Backend (Nuitka)
        shell: bash
        run: |
          # Initialize Conda and activate your specific environment
          source ~/anaconda3/etc/profile.d/conda.sh || source /opt/anaconda3/etc/profile.d/conda.sh

          # Activate existing environment (already created manually)
          conda activate StockD_build_cpu

          export PYTHON=$(which python)
          export PIP=$(which pip)
          
          cd ML
          python -m nuitka main.py \
            --standalone \

            --lto=yes \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --jobs=6  \
            --low-memory

          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend && cp -r artifacts ../backend/ 2>/dev/null || true && cp *.keras *.pkl ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..

          # 4. Flutter Build
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          
          # 5. Inject Backend
          BUNDLE="build/linux/$ARCH/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          
          # 6. Desktop Entry & Packaging
          mkdir -p linux_desktop && cat > linux_desktop/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF
          
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/
          cp assets/images/StockD.png $DEB_ROOT/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: StockD-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-$JOB_ID-1.2.0.deb
          
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS $RPM_STAGE/usr/share/pixmaps $RPM_STAGE/usr/share/applications
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $RPM_STAGE/usr/share/applications/
          cp assets/images/StockD.png $RPM_STAGE/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: StockD-$JOB_ID
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          BuildArch: $RPM
          Requires: gtk3
          %description
          AI Coach
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          /usr/share/pixmaps/stockd.png
          EOF
          rpmbuild -bb --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM/*.rpm ./StockD-$JOB_ID-1.2.0.rpm

      - name: Split and Upload
        run: |
          for f in *.{deb,rpm}; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 1990000000 ]; then split -b 1900M "$f" "${f}.part_"; rm "$f"; fi
          done
          gh release upload latest *.deb *.rpm *.part_* --clobber
            
      - name: Cleanup
        if: always()
        run: |
          rm -rf build/ backend/ pkg_deb/ $HOME/rpmbuild/ linux_desktop/ dist/

  # ==========================================
  # JOB: X64 NVIDIA (Self-Hosted)
  # ==========================================
  linux-x64-nvidia:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-x64-nvidia' }}
    runs-on: self-hosted
    env: {ARCH: "x64", DEB: "amd64", RPM: "x86_64", JOB_ID: "x64-nvidia" }
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package Backend (Nuitka)
        shell: bash
        run: |
         # Initialize conda
         source ~/anaconda3/etc/profile.d/conda.sh || source /opt/anaconda3/etc/profile.d/conda.sh

          # Activate existing environment (already created manually)
          conda activate StockD_build_cuda

          export PYTHON=$(which python)
          export PIP=$(which pip)
          
          cd ML
          python -m nuitka main.py \
            --standalone \
            --plugin-enable=tensorflow \
            --plugin-enable=anti-bloat \
            --lto=yes \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --jobs=6 \
            --low-memory

          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend 2>/dev/null || mv ../backend/main.bin ../backend/sage_backend 2>/dev/null || true
          chmod 755 ../backend/sage_backend && cp -r artifacts ../backend/ 2>/dev/null || true && cp *.keras *.pkl ml_config.py ../backend/ 2>/dev/null || true
          rm -rf dist && cd ..

          flutter config --enable-linux-desktop
          flutter build linux --release --build-name=1.2.0
          
          BUNDLE="build/linux/x64/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          
          mkdir -p linux_desktop && cat > linux_desktop/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF
          
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/
          cp assets/images/StockD.png $DEB_ROOT/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: StockD-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-$JOB_ID-1.2.0.deb
          
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS $RPM_STAGE/usr/share/pixmaps $RPM_STAGE/usr/share/applications
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $RPM_STAGE/usr/share/applications/
          cp assets/images/StockD.png $RPM_STAGE/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: StockD-$JOB_ID
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          BuildArch: $RPM
          Requires: gtk3
          %description
          AI Coach
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          /usr/share/pixmaps/stockd.png
          EOF
          rpmbuild -bb --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/$RPM/*.rpm ./StockD-$JOB_ID-1.2.0.rpm

      - name: Split and Upload
        run: |
          for f in *.{deb,rpm}; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 1990000000 ]; then split -b 1900M "$f" "${f}.part_"; rm "$f"; fi
          done
          gh release upload latest *.deb *.rpm *.part_* --clobber
            
      - name: Cleanup
        if: always()
        run: |
          source /home/gautam/anaconda3/etc/profile.d/conda.sh
          conda env remove -n nuitka_build_env
          rm -rf build/ backend/ pkg_deb/ $HOME/rpmbuild/ linux_desktop/ dist/

  # ==========================================
  # JOB: ARM64 (Cloud-Hosted)
  # ==========================================
  linux-arm64:
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux-arm64' }}
    runs-on: ubuntu-24.04-arm
    env: { PKGS: "tensorflow", ARCH: "arm64", DEB: "arm64", RPM: "aarch64", JOB_ID: "arm64" }
    steps:
      - uses: actions/checkout@v4
      - name: Manual Flutter Setup
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev
          git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/flutter/bin"
          flutter config --enable-linux-desktop
          flutter doctor

      - name: Build and Package
        shell: bash
        run: |
          export PATH="$PATH:$HOME/flutter/bin"
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm dpkg-dev
          sudo pip3 install --break-system-packages --ignore-installed nuitka zstandard ordered-set yfinance fastapi uvicorn peewee blosc2 scipy numpy pandas ${PKGS}
          
          cd ML
          python3 -m nuitka main.py --standalone --output-dir=dist --jobs=2 --plugin-enable=anti-bloat --include-package=tensorflow --clang
          cd ..
          
          mkdir -p backend && cp -r ML/dist/main.dist/* backend/
          mv backend/main backend/sage_backend 2>/dev/null || mv backend/main.bin backend/sage_backend 2>/dev/null || true
          chmod 755 backend/sage_backend
          
          flutter build linux --release --build-name=1.2.0
          BUNDLE="build/linux/arm64/release/bundle"
          mkdir -p $BUNDLE/data/flutter_assets/backend_bundle
          cp -r backend/* $BUNDLE/data/flutter_assets/backend_bundle/
          
          mkdir -p linux_desktop && cat > linux_desktop/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF
          
          DEB_ROOT="pkg_deb"
          mkdir -p $DEB_ROOT/DEBIAN $DEB_ROOT/usr/bin $DEB_ROOT/usr/lib/StockD-1.2.0 $DEB_ROOT/usr/share/applications $DEB_ROOT/usr/share/pixmaps
          cp -r $BUNDLE/* $DEB_ROOT/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $DEB_ROOT/usr/share/applications/
          cp assets/images/StockD.png $DEB_ROOT/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $DEB_ROOT/usr/bin/stockd
          cat > $DEB_ROOT/DEBIAN/control << EOF
          Package: StockD-$JOB_ID
          Version: 1.2.0
          Architecture: $DEB
          Maintainer: Gautam Mahajan
          Description: StockD AI
          Depends: libgtk-3-0
          EOF
          dpkg-deb --root-owner-group --build $DEB_ROOT StockD-$JOB_ID-1.2.0.deb
          
          RPM_ROOT=$HOME/rpmbuild && RPM_STAGE="$RPM_ROOT/BUILDROOT/StockD-1.2.0"
          mkdir -p $RPM_STAGE/usr/lib/StockD-1.2.0 $RPM_STAGE/usr/bin $RPM_ROOT/SPECS $RPM_STAGE/usr/share/pixmaps $RPM_STAGE/usr/share/applications
          cp -r $BUNDLE/* $RPM_STAGE/usr/lib/StockD-1.2.0/
          cp linux_desktop/stockd.desktop $RPM_STAGE/usr/share/applications/
          cp assets/images/StockD.png $RPM_STAGE/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/StockD-1.2.0/stockd $RPM_STAGE/usr/bin/stockd
          cat > $RPM_ROOT/SPECS/StockD.spec << EOF
          Name: StockD-$JOB_ID
          Version: 1.2.0
          Release: 1
          Summary: StockD AI
          BuildArch: aarch64
          Requires: gtk3
          %description
          AI Coach
          %files
          /usr/lib/StockD-1.2.0
          /usr/bin/stockd
          /usr/share/applications/stockd.desktop
          /usr/share/pixmaps/stockd.png
          EOF
          rpmbuild -bb --define "_topdir $RPM_ROOT" --buildroot "$RPM_STAGE" $RPM_ROOT/SPECS/StockD.spec
          mv $RPM_ROOT/RPMS/aarch64/*.rpm ./StockD-$JOB_ID-1.2.0.rpm

      - name: Split and Upload
        run: |
          for f in *.{deb,rpm}; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 1990000000 ]; then split -b 1900M "$f" "${f}.part_"; rm "$f"; fi
          done
          gh release upload latest *.deb *.rpm *.part_* --clobber
            
      - name: Cleanup
        if: always()
        run: rm -rf build/ backend/ pkg_deb/ $HOME/rpmbuild/ linux_desktop/ dist/
