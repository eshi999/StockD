name: Linux Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-matrix:
    name: Configure Linux Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: python
        run: |
          import os, json
          matrix = [
            {"id": "nvidia", "os": "self-hosted", "arch": "x64", "tf_pkg": "tensorflow[and-cuda]", "python_ver": "3.12"},
            {"id": "intel", "os": "self-hosted", "arch": "x64", "tf_pkg": "tensorflow-intel", "python_ver": "3.12"},
            {"id": "amd", "os": "self-hosted", "arch": "x64", "tf_pkg": "tensorflow", "python_ver": "3.12"},
            {"id": "arm64", "os": "ubuntu-24.04-arm", "arch": "arm64", "tf_pkg": "tensorflow", "python_ver": "3.12"}
          ]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"matrix<<EOF\n{json.dumps(matrix)}\nEOF\n")

  build:
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_ver }}

      - name: Build backend (Nuitka)
        shell: bash
        run: |
          # Use existing Conda on self-hosted, fallback to pip on cloud ARM64
          if [ "${{ matrix.os }}" == "self-hosted" ]; then
            conda activate sage_env
          fi
          pip install nuitka zstandard ordered-set ${{ matrix.tf_pkg }} fastapi uvicorn pandas scikit-learn yfinance
          
          cd ML && python -m nuitka main.py --standalone --output-dir=dist \
            --jobs=$(nproc) --plugin-enable=anti-bloat \
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite
          
          mkdir -p ../backend && cp -r dist/main.dist/* ../backend/
          mv ../backend/main ../backend/sage_backend || true
          rm -rf dist

      - name: Build Flutter & Package
        run: |
          sudo apt-get update && sudo apt-get install -y rpm dpkg-dev
          flutter config --enable-linux-desktop
          flutter build linux --release
          
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          PKG="package_root_${{ matrix.id }}"
          mkdir -p $PKG/usr/lib/stockd/backend $PKG/usr/bin $PKG/usr/share/applications $PKG/usr/share/pixmaps
          
          cp -r $BUNDLE/* $PKG/usr/lib/stockd/
          cp -r backend/* $PKG/usr/lib/stockd/backend/
          chmod 755 $PKG/usr/lib/stockd/backend/sage_backend
          
          cat > $PKG/usr/share/applications/stockd.desktop << EOF
          [Desktop Entry]
          Name=StockD
          Exec=/usr/bin/stockd
          Icon=stockd
          Type=Application
          Categories=Finance;Education;
          EOF
          cp assets/images/StockD.png $PKG/usr/share/pixmaps/stockd.png
          ln -s /usr/lib/stockd/stockd $PKG/usr/bin/stockd

          mkdir -p $PKG/DEBIAN
          echo -e "Package: stockd-${{ matrix.id }}\nVersion: 1.2.0\nArchitecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}\nMaintainer: StockD\nDescription: AI Stock App\nDepends: libgtk-3-0" > $PKG/DEBIAN/control
          dpkg-deb --build $PKG StockD-${{ matrix.id }}.deb
          
          RPM=$HOME/rpmbuild
          mkdir -p $RPM/{BUILDROOT,SPECS,RPMS}
          cp -r $PKG/* $RPM/BUILDROOT/stockd-${{ matrix.id }}.x86_64/
          echo -e "Name: stockd-${{ matrix.id }}\nVersion: 1.2.0\nRelease: 1\nBuildArch: x86_64\n%files\n/usr" > $RPM/SPECS/stockd.spec
          rpmbuild -bb --define "_topdir $RPM" $RPM/SPECS/stockd.spec
          mv $RPM/RPMS/x86_64/*.rpm StockD-${{ matrix.id }}.rpm

      - name: Split and Upload
        shell: bash
        run: |
          # Split any file exceeding 1.9GB into parts
          find . -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" \) -size +1900M | while read f; do
            split -b 1900M "$f" "$f.part_"
            rm "$f"
          done

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          files: |
            *.deb
            *.rpm
            *.part_*
