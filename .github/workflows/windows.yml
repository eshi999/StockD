name: Windows Build
on: [workflow_dispatch]
permissions: {contents: write}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build SAGE Backend (Nuitka)
        shell: powershell
        run: |
          # 1. Install Dependencies
          pip install nuitka zstandard ordered-set tensorflow fastapi uvicorn pandas scikit-learn yfinance
          
          # 2. Build Backend (Hardened for stability)
          # --jobs=1: Avoids memory heap collision (C1060)
          # --msvc=latest: Forces use of the newest compiler toolchain
          python -m nuitka ML/main.py --standalone `
            --assume-yes-for-downloads `
            --output-dir=dist `
            --jobs=4 `
            --plugin-enable=anti-bloat `
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite `
            --include-package=tensorflow `
            --msvc=latest
            
          # 3. Handle Artifacts using PowerShell commands
          New-Item -ItemType Directory -Path "backend" -Force
          Copy-Item -Path "dist\main.dist\*" -Destination "backend\" -Recurse -Force
          
          # 4. Rename executable
          if (Test-Path "backend\main.exe") { 
              Rename-Item -Path "backend\main.exe" -NewName "sage_backend.exe" 
          }
          
          # 5. Cleanup temp dist
          Remove-Item -Path "dist" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Flutter GUI
        shell: powershell
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Inject Backend & Package (NSIS)
        shell: powershell
        run: |
          # Inject Backend
          $target = "build\windows\x64\runner\Release\data\flutter_assets\backend_bundle"
          if (!(Test-Path $target)) { New-Item -ItemType Directory -Force -Path $target }
          Copy-Item -Recurse -Path "backend\*" -Destination $target -Force
          Remove-Item -Recurse -Force -Path "backend"

          # Generate Icon
          magick "assets\images\StockD.png" -define icon:auto-resize=256,128,64,48,32,16 "nsis_icon.ico"

          # Generate NSIS Script
          $nsisScript = @"
          !include "MUI2.nsh"
          Name "StockD"
          OutFile "StockD-win-x64.exe"
          InstallDir "`$PROGRAMFILES64\StockD"
          !define MUI_ICON "nsis_icon.ico"
          !define MUI_UNICON "nsis_icon.ico"
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          
          Section "MainSection" SEC01
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            File "/oname=StockD_Logo.ico" "nsis_icon.ico"
            WriteUninstaller "`$INSTDIR\uninstall.exe"
            CreateDirectory "`$SMPROGRAMS\StockD"
            CreateShortcut "`$SMPROGRAMS\StockD\StockD.lnk" "`$INSTDIR\StockD.exe" "" "`$INSTDIR\StockD_Logo.ico" 0
            CreateShortcut "`$DESKTOP\StockD.lnk" "`$INSTDIR\StockD.exe" "" "`$INSTDIR\StockD_Logo.ico" 0
          SectionEnd
          
          Section "Uninstall"
            Delete "`$INSTDIR\uninstall.exe"
            Delete "`$INSTDIR\StockD_Logo.ico"
            RMDir /r "`$INSTDIR"
            Delete "`$SMPROGRAMS\StockD\StockD.lnk"
            Delete "`$DESKTOP\StockD.lnk"
            RMDir "`$SMPROGRAMS\StockD"
          SectionEnd
          "@
          $nsisScript | Out-File -FilePath "StockD.nsi" -Encoding ascii
          
          # Compile
          & "C:\Program Files (x86)\NSIS\makensis.exe" StockD.nsi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          files: StockD-win-x64.exe

      - name: Cleanup Workspace
        if: always()
        shell: powershell
        run: |
          Remove-Item -Recurse -Force -Path "." -Include "build", "dist", "backend", "StockD.nsi", "nsis_icon.ico" -ErrorAction SilentlyContinue
