name: Windows Build
on: [workflow_dispatch]
permissions: {contents: write}

# Force Git Bash for all steps
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}

      - name: Build and Package
        run: |
          # Use the path to python (adjust if necessary for your local install)
          python -m pip install --upgrade pip
          pip install nuitka zstandard ordered-set tensorflow fastapi uvicorn pandas scikit-learn yfinance numpy
          
          # Nuitka build
          python -m nuitka ML/main.py --standalone --output-dir=dist --include-package=tensorflow --jobs=0
          
          # Flutter Build
          flutter build windows --release
          
          # Inject Backend
          DEST="build/windows/x64/runner/Release/data/flutter_assets/backend_bundle"
          mkdir -p "$DEST"
          cp -r dist/main.dist/* "$DEST"
          
          # NSIS Packaging (Uses Git Bash compatible syntax for calling exe)
          "/c/Program Files (x86)/NSIS/makensis.exe" /DVERSION=1.0.0 installer.nsi
          
          # Splitting logic
          if [ $(stat -c%s "StockD-Installer.exe") -gt 1990000000 ]; then
            split -b 1900m "StockD-Installer.exe" "StockD-Installer.exe.part_"
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          files: |
            StockD-Installer.exe
            StockD-Installer.exe.part_*
