name: Windows Build
on: [workflow_dispatch]
permissions: {contents: write}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build and Package
        shell: powershell
        run: |
          pip install nuitka zstandard ordered-set tensorflow fastapi uvicorn pandas scikit-learn yfinance
          python -m nuitka ML/main.py --standalone --output-dir=dist --include-package=tensorflow
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=1.0.0 installer.nsi
          
          # Splitting logic
          $file = Get-Item "StockD-Installer.exe"
          if ($file.Length -gt 1990000000) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $chunkSize = 1900MB
            for ($i = 0; $i -lt [Math]::Ceiling($bytes.Length / $chunkSize); $i++) {
              $chunk = $bytes[$i*$chunkSize..(([Math]::Min(($i+1)*$chunkSize, $bytes.Length) - 1))]
              [System.IO.File]::WriteAllBytes("StockD-Installer.exe.part_$i", $chunk)
            }
          }
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          overwrite_files: true
          files: |
            StockD-Installer.exe
            StockD-Installer.exe.part_*
