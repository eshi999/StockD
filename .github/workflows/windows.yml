name: Windows Build
on: [workflow_dispatch]
permissions: { contents: write }

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build SAGE Backend (Nuitka)
        shell: powershell
        run: |
          pip install --upgrade pip
          pip install nuitka zstandard ordered-set tensorflow fastapi uvicorn pandas scikit-learn yfinance
          
          # Build Backend
          python -m nuitka ML/main.py --standalone `
            --assume-yes-for-downloads `
            --output-dir=dist `
            --jobs=6 `
            --plugin-enable=anti-bloat `
            --nofollow-import-to=tensorboard,tensorflow_estimator,tensorflow.compiler,tensorflow.lite `
            --include-package=tensorflow `
            --msvc=latest

          # Preserve Structure
          New-Item -ItemType Directory -Path "backend" -Force
          Copy-Item -Path "dist\main.dist" -Destination "backend\" -Recurse -Force

          # Rename Binary
          if (Test-Path "backend\main.dist\main.exe") { Rename-Item -Path "backend\main.dist\main.exe" -NewName "sage_backend.exe" }
          elseif (Test-Path "backend\main.dist\main.bin") { Rename-Item -Path "backend\main.dist\main.bin" -NewName "sage_backend.exe" }

          # Copy Artifacts
          if (Test-Path "ML\artifacts") { Copy-Item -Recurse -Path "ML\artifacts" -Destination "backend\main.dist\" -Force }
          if (Test-Path "ML\sage_model.keras") { Copy-Item -Path "ML\sage_model.keras" -Destination "backend\main.dist\" -Force }
          Get-ChildItem -Path "ML\*.pkl" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName -Destination "backend\main.dist\" -Force }
          if (Test-Path "ML\ml_config.py") { Copy-Item -Path "ML\ml_config.py" -Destination "backend\main.dist\" -Force }
          
          Remove-Item -Path "dist" -Recurse -Force

      - name: Prepare Icons & Build Flutter GUI
        shell: powershell
        run: |
          # 1. Generate the icon from your PNG
          pip install Pillow
          python -c "from PIL import Image; img = Image.open('assets/images/StockD.png').convert('RGBA'); img.save('nsis_icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

          # 2. Overwrite Flutter's default Windows icon BEFORE building
          Copy-Item -Path "nsis_icon.ico" -Destination "windows\runner\resources\app_icon.ico" -Force
          
          # 3. Build the Flutter app (it will natively use your new icon)
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Inject Backend
        shell: powershell
        run: |
          # Inject Backend into the Flutter build directory
          $target = "build\windows\x64\runner\Release\data\flutter_assets\backend_bundle"
          New-Item -ItemType Directory -Force -Path $target
          Copy-Item -Recurse -Path "backend\main.dist\*" -Destination $target -Force
          Remove-Item -Recurse -Force -Path "backend"

      - name: Package (NSIS)
        shell: powershell
        run: |
          # NSIS Script
          $nsisScript = @"
          !include "MUI2.nsh"
          Name "StockD"
          OutFile "StockD-win-x64.exe"
          InstallDir "`$PROGRAMFILES64\StockD"
          
          ; Use the icon we generated earlier
          !define MUI_ICON "nsis_icon.ico"
          !define MUI_UNICON "nsis_icon.ico"
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          
          Section "MainSection" SEC01
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*.*"
            
            ; Copy the icon into the install directory for the shortcuts
            File "nsis_icon.ico" 
            
            WriteUninstaller "`$INSTDIR\uninstall.exe"
            
            ; Create shortcuts explicitly pointing to the .ico file
            CreateShortcut "`$SMPROGRAMS\StockD.lnk" "`$INSTDIR\StockD.exe" "" "`$INSTDIR\nsis_icon.ico" 0
            CreateShortcut "`$DESKTOP\StockD.lnk" "`$INSTDIR\StockD.exe" "" "`$INSTDIR\nsis_icon.ico" 0
          SectionEnd
          
          Section "Uninstall"
            Delete "`$INSTDIR\uninstall.exe"
            Delete "`$SMPROGRAMS\StockD.lnk"
            Delete "`$DESKTOP\StockD.lnk"
            Delete "`$INSTDIR\nsis_icon.ico"
            RMDir /r "`$INSTDIR"
          SectionEnd
          "@
          $nsisScript | Out-File -FilePath "StockD.nsi" -Encoding ascii
          
          & "C:\Program Files (x86)\NSIS\makensis.exe" StockD.nsi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          overwrite_files: true
          files: StockD-win-x64.exe

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          # Note: Removed rcedit from cleanup list
          $paths = @("build", "dist", "backend", "pkg_deb", "StockD.nsi", "nsis_icon.ico")
          foreach ($p in $paths) { if (Test-Path $p) { Remove-Item -Recurse -Force -Path $p } }
