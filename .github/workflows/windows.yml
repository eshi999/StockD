name: Windows Build
on: [workflow_dispatch]
permissions: {contents: write}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable'}
      
      - name: Build and Package
        run: |
          pip install nuitka zstandard ordered-set tensorflow fastapi uvicorn pandas scikit-learn yfinance numpy
          
          # 1. Build Backend
          python -m nuitka ML/main.py --standalone --output-dir=dist --include-package=tensorflow --jobs=1 --low-memory --msvc=latest --disable-ccache
          
          # 2. Build Frontend
          flutter build windows --release
          
          # 3. Inject Backend
          $DEST = "build\windows\x64\runner\Release\data\flutter_assets\backend_bundle"
          if (!(Test-Path $DEST)) { New-Item -ItemType Directory -Path $DEST }
          Copy-Item -Path "dist\main.dist\*" -Destination $DEST -Recurse -Force
          
          # 4. Generate NSIS Script Dynamically
          $nsisScript = @"
          !include "MUI2.nsh"
          Name "StockD"
          OutFile "StockD-win-x64.exe"
          InstallDir "`$PROGRAMFILES\StockD"
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "MainSection" SEC01
            SetOutPath "`$INSTDIR"
            File /r "build\windows\x64\runner\Release\*"
            WriteUninstaller "`$INSTDIR\uninstall.exe"
          SectionEnd
          "@
          $nsisScript | Out-File -FilePath "installer.nsi" -Encoding ascii
          
          # 5. Compile NSIS Installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: StockD-win-x64.exe
