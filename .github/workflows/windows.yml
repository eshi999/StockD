- name: Cleanup Build Artifacts
        if: always() # Always runs, even if the build fails
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "dist" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue
          Remove-Item -Force "installer.nsi" -ErrorAction SilentlyContinue
          # Optionally clear the Python cache if you have space issues
          # Remove-Item -Recurse -Force "$env:LOCALAPPDATA\pip\Cache" -ErrorAction SilentlyContinue
